<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Truck Art Rally</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#0b0e14; touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; }
  #game { position:fixed; inset:0; }
  canvas { display:block; }
  #loader { position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; z-index:10;
    background:radial-gradient(120% 100% at 50% 0%, #1b2433 0%, #0b0e14 70%);
    color:#ffd76a; font-family:"Trebuchet MS", Verdana, sans-serif; }
  #loader .bar { width:min(70vw,340px); height:10px; border-radius:6px;
    background:#222b3a; overflow:hidden; border:1px solid #3a4a63; }
  #loader .fill { height:100%; width:0%; border-radius:6px;
    background:linear-gradient(90deg,#ff5f3d,#ffb13d,#ffe27a); transition:width .15s; }
  #loader button { display:none; padding:12px 26px; font-size:17px; border:0;
    border-radius:10px; background:#ffb13d; color:#231600; font-weight:bold; }
</style>
</head>
<body>
<div id="game"></div>
<div id="loader">
  <div style="font-size:22px; letter-spacing:2px; font-weight:bold;">TRUCK ART RALLY</div>
  <div class="bar"><div class="fill" id="loadfill"></div></div>
  <div id="loadmsg" style="font-size:13px; color:#9fb2cc;">Painting the truck…</div>
  <button id="retrybtn">TRY AGAIN</button>
</div>
<script src="phaser-3.60.0.min.js"></script>
<script src="game.js"></script>
</body>
</html>
