<script>
window.addEventListener('load', function () {
  try {
    var game = new Phaser.Game(window.DUSK.makeConfig());
    window.__duskline = game;
  } catch (e) {
    document.getElementById('game-root').innerHTML =
      '<div style="color:#ff6a6a;padding:60px 30px;text-align:center;font-size:18px">' +
      'DUSKLINE could not start on this browser.<br>Please try the latest Chrome or Safari.<br><br>' +

});
// keep canvas sized on rotation / resize
