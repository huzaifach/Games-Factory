function drawHowtoArt(ctx, step, x, y, t) {
  ctx.save();
  ctx.translate(x, y);
  if (step === 0) {
    // finger touching blob
    jellyBlobArt(ctx, 0, 10, 46, '#ff8fb3', 0.15);
    ctx.fillStyle = '#ffd9b3';
    ctx.beginPath(); ctx.arc(52, -34, 20, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#e8a06c'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(52, -34, 20, 0, TAU); ctx.stroke();
    ctx.strokeStyle = '#4a3b5c'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 10, 62, -0.5, 0.9); ctx.stroke();
  } else if (step === 1) {
    // stretched blob with arrows
    ctx.save(); ctx.scale(1.7, 0.75);
    jellyBlobArt(ctx, 0, 0, 40, '#ffd166', 0);
    ctx.restore();
    ctx.strokeStyle = '#4a3b5c'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (const sx of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(sx * 70, 0); ctx.lineTo(sx * 104, 0); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(sx * 104, 0); ctx.lineTo(sx * 88, -10); ctx.lineTo(sx * 88, 10);
      ctx.closePath(); ctx.fillStyle = '#4a3b5c'; ctx.fill();
    }
  } else {
    // fling arc
    ctx.strokeStyle = '#4a3b5c'; ctx.lineWidth = 4; ctx.setLineDash([10, 10]);
    ctx.beginPath(); ctx.arc(-20, 60, 70, -Math.PI / 2 - 0.4, 0.5); ctx.stroke();
    ctx.setLineDash([]);
    const ft = (t * 1.4) % 1;
    const a = -Math.PI / 2 - 0.4 + ft * 1.9;
    const bx = -20 + Math.cos(a) * 70, by = 60 + Math.sin(a) * 70;
    jellyBlobArt(ctx, bx, by, 34, '#7fe3b2', Math.sin(t * 6) * 0.06);
    for (let i = 0; i < 3; i++) {
      const sx = -60 + i * 26, sy = -52 - (i % 2) * 14;
      ctx.fillStyle = '#ffd166';
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(t * 2 + i);
      ctx.fillRect(-7, -2, 14, 4); ctx.fillRect(-2, -7, 4, 14);
      ctx.restore();
    }
  }
  ctx.restore();
}

function jellyBlobArt(ctx, x, y, r, color, wob) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1 + wob, 1 - wob);
  const g = ctx.createLinearGradient(0, -r, 0, r);
  g.addColorStop(0, Util.shade(color, 36)); g.addColorStop(1, Util.shade(color, -12));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.ellipse(-r * 0.32, -r * 0.4, r * 0.28, r * 0.15, -0.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#4a3b5c';
  ctx.beginPath(); ctx.arc(-r * 0.28, -r * 0.05, r * 0.11, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.28, -r * 0.05, r * 0.11, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#4a3b5c'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, r * 0.28, r * 0.24, 0.25 * Math.PI, 0.75 * Math.PI); ctx.stroke();
  ctx.restore();
}

function drawWorlds(ctx, game) {
  const g = ctx.createLinearGradient(0, 0, 0, STAGE_H);
  g.addColorStop(0, '#f3e8ff'); g.addColorStop(1, '#e0d0f5');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, STAGE_W, STAGE_H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#4a3b5c';
  ctx.font = 'bold 44px "Baloo 2", sans-serif';
  ctx.fillText('Pick a World', STAGE_W / 2, 120);
  const glyphs = ['tower', 'bounce', 'magnet', 'ride', 'flower', 'pillow'];
  for (let i = 0; i < DIORAMAS.length; i++) {
    const d = DIORAMAS[i];
    const col = i % 2, row = Math.floor(i / 2);
    const cw = 340, ch = 250;
    const x = 40 + col * (cw + 40), y = 190 + row * (ch + 24);
    const selected = i === game.dioramaIndex;
    ctx.fillStyle = selected ? '#fff3d6' : 'rgba(255,255,255,0.9)';
    Util.rr(ctx, x, y, cw, ch, 26);
    ctx.fill();
    ctx.strokeStyle = selected ? '#ffb14e' : '#e0d4ee';
    ctx.lineWidth = selected ? 6 : 3;
    Util.rr(ctx, x, y, cw, ch, 26);
    ctx.stroke();
    drawGiggleIcon(ctx, glyphs[i], x + 70, y + 80, 64, true);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#4a3b5c';
    ctx.font = 'bold 30px "Baloo 2", sans-serif';
    ctx.fillText(d.name, x + 120, y + 56);
    ctx.font = '20px "Baloo 2", sans-serif';
    ctx.fillStyle = '#7a6a8f';
    ctx.fillText(d.tagline, x + 120, y + 96);
    // giggle progress for this world
    let found = 0;
    for (const gg of d.giggles) if (game.save.found.indexOf(gg.id) >= 0) found++;
    ctx.font = 'bold 24px "Baloo 2", sans-serif';
    ctx.fillStyle = '#d14e7f';
    ctx.textAlign = 'center';
    ctx.fillText('★ ' + found + ' / 3 giggles', x + cw / 2, y + ch - 40);
    if (selected) {
      ctx.fillStyle = '#4a3b5c';
      ctx.font = '20px "Baloo 2", sans-serif';
      ctx.fillText('— playing now —', x + cw / 2, y + ch - 72);
    }
    // invisible tap handled via card rects in game input
  }
  for (const b of game.buttons) b.draw(ctx, game);
}

function drawJournal(ctx, game) {
  ctx.fillStyle = 'rgba(40,28,58,0.55)';
  ctx.fillRect(0, 0, STAGE_W, STAGE_H);
  const P = { x: 60, y: 150, w: 680, h: 900 };
  ctx.fillStyle = 'rgba(255,247,251,0.98)';
  Util.rr(ctx, P.x, P.y, P.w, P.h, 30);
  ctx.fill();
  ctx.strokeStyle = '#ffd6e8'; ctx.lineWidth = 5;
  Util.rr(ctx, P.x, P.y, P.w, P.h, 30);
  ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#4a3b5c';
  ctx.font = 'bold 38px "Baloo 2", sans-serif';
  const n = game.save.found.length;
  ctx.fillText('Giggle Journal  ★ ' + n + ' / ' + GIGGLE_TOTAL, P.x + P.w / 2, P.y + 52);
  ctx.fillStyle = '#7a6a8f';
  ctx.font = '20px "Baloo 2", sans-serif';
  ctx.fillText('Can you find them all?', P.x + P.w / 2, P.y + 92);
  // two columns x three worlds
  for (let di = 0; di < DIORAMAS.length; di++) {
    const d = DIORAMAS[di];
    const col = Math.floor(di / 3), row = di % 3;
    const x0 = P.x + 36 + col * 322;
    let y = P.y + 140 + row * 246;
    ctx.textAlign = 'left';
    ctx.font = 'bold 24px "Baloo 2", sans-serif';
    ctx.fillStyle = '#4a3b5c';
    ctx.fillText(d.name, x0, y);
    y += 46;
    for (const gg of d.giggles) {
      const found = game.save.found.indexOf(gg.id) >= 0;
      drawGiggleIcon(ctx, gg.icon, x0 + 26, y, 38, found);
      ctx.textAlign = 'left';
      ctx.font = '20px "Baloo 2", sans-serif';
      ctx.fillStyle = found ? '#4a3b5c' : '#a89dc0';
      ctx.fillText(found ? gg.name : '???', x0 + 56, y);
      y += 54;
    }
  }
  // close handled by game button
  for (const b of game.buttons) b.draw(ctx, game);
}

/* ---------- HUD ---------- */
function drawHUD(ctx, game) {
  const d = DIORAMAS[game.dioramaIndex];
  // top-left: round buttons (drawn via game.buttons, device space)
  for (const b of game.buttons) b.draw(ctx, game);
  // below buttons: world pill with name + giggle count
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const n = game.save.found.length;
  ctx.font = 'bold 22px "Baloo 2", sans-serif';
  const label = d.name + '   ★ ' + n + '/' + GIGGLE_TOTAL;
  const w = Math.min(ctx.measureText(label).width + 40, game.cw - 24);
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  Util.rr(ctx, 12, 92, w, 44, 22);
  ctx.fill();
  ctx.fillStyle = '#4a3b5c';
  ctx.fillText(label, 32, 115);
  // bottom hint bar
  const hint = game.currentHint();
  ctx.font = '22px "Baloo 2", sans-serif';
  const hw = Math.min(ctx.measureText(hint).width + 60, game.cw - 32);
  const hx = (game.cw - hw) / 2, hy = game.ch - 92;
  ctx.fillStyle = 'rgba(74,59,92,0.78)';
  Util.rr(ctx, hx, hy, hw, 60, 30);
  ctx.fill();
  ctx.fillStyle = '#ffe9a8';
  ctx.font = 'bold 20px "Baloo 2", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Try this:', hx + 22, hy + 31);
  ctx.fillStyle = '#ffffff';
  ctx.font = '21px "Baloo 2", sans-serif';
  // trim hint to fit
  let ht = hint;
  while (ctx.measureText(ht).width > hw - 150 && ht.length > 4) ht = ht.slice(0, -2);
  if (ht !== hint) ht = ht.slice(0, -1) + '…';
  ctx.fillText(ht, hx + 118, hy + 31);
}

function drawTutorial(ctx, game) {
  const tut = game.tutorial;
  if (!tut || tut.done || tut.step > 2) return;
  const t = game.time;
  const pulse = 1 + Math.sin(t * 7) * 0.12;
  // pulsing ring on the target (stage space)
  if (tut.target) {
    const c = tut.target.centroid(TutorialUtil._c);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 6;
    ctx.setLineDash([16, 12]);
    ctx.lineDashOffset = -t * 60;
    ctx.beginPath();
    ctx.arc(c.x, c.y, (tut.target.restR + 26) * pulse, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    if (tut.step === 1) {
      // drag arrow
      const ax = c.x + 120, ay = c.y - 60;
      const slide = Math.sin(t * 4) * 26;
      ctx.strokeStyle = '#ff6f9f'; ctx.lineWidth = 10; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(ax - 60 + slide, ay); ctx.lineTo(ax + 60 + slide, ay);
      ctx.stroke();
      ctx.fillStyle = '#ff6f9f';
      ctx.beginPath();
      ctx.moveTo(ax + 84 + slide, ay); ctx.lineTo(ax + 52 + slide, ay - 18); ctx.lineTo(ax + 52 + slide, ay + 18);
      ctx.closePath(); ctx.fill();
    }
  }
}

// tutorial text bubble: device space, below the HUD pill — never cropped
function drawTutorialBubble(ctx, game) {
  const tut = game.tutorial;
  if (!tut || tut.done || tut.step > 2) return;
  const t = game.time;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const msgs = [
    'Touch a jelly friend to grab it!',
    'Now DRAG to stretch it far!',
    'Let go — FLING!'

class Bus {
  constructor() { this.map = {}; }
  on(evt, fn) {
    if (!this.map[evt]) this.map[evt] = [];
    this.map[evt].push(fn);

  emit(evt, data) {
    const arr = this.map[evt];
    if (!arr) return;
    for (let i = 0; i < arr.length; i++) {

  }
}

    }
    // empty space: tiny dust poof for feedback
    this.world.particles.spawn('poof', s.x, s.y, { life: 0.4, size: 12, color: '#ffffff' });
  }

  handleMove(dx, dy, pid) {
    if (this.screen !== 'play' || this.overlay) return;
    if (!this.grabbed) return;
    const s = this.toStage(dx, dy);
    const g = this.grabbed;
    g.moveGrab(s.x, s.y);
    const now = this.time;
    this.grabTrail.push({ x: s.x, y: s.y, t: now });
    while (this.grabTrail.length > 2 && now - this.grabTrail[0].t > 0.25) this.grabTrail.shift();
    // stretch sfx (throttled)
    const st = g.stretch();
    if (st > 1.5 && now - this._stretchSfxT > 0.4) {
      this._stretchSfxT = now;
      this.audio.stretchSfx(Util.clamp((st - 1.5) / 1.2, 0, 1));
    }
    // tutorial: stretch step
    if (this.tutorial && !this.tutorial.done && this.tutorial.step === 1 && st > 1.4) {
      this.tutorial.step = 2;
      this.audio.uiClick();
    }
    // petting: slow gentle movement = hearts
    const n = this.grabTrail.length;
    if (n >= 2) {
      const a = this.grabTrail[0], b = this.grabTrail[n - 1];
      const moved = Util.dist(a.x, a.y, b.x, b.y);
      const dt = Math.max(0.01, b.t - a.t);
      const spd = moved / dt;
      if (spd < 90 && now - this.grabStartT > 1.0) {
        this.petT -= 0.016;
        if (this.petT <= 0) {
          this.petT = 0.7;
          const c = g.centroid(Game._c);
          this.world.particles.spawn('heart', c.x + Util.rand(-20, 20), c.y - g.restR,
            { life: 1.1, size: 14, color: '#ff8fb3', vy: -50 });
          this.audio.uiClick();
        }
      } else {
        this.petT = 0.4;
      }
    }
  }

  handleUp(dx, dy, pid) {
    if (this.screen !== 'play') return;
    if (!this.grabbed || this.grabbedPid !== pid) return;
    const g = this.grabbed;
    const now = this.time;
    // fling velocity from recent trail
    let vx = 0, vy = 0;
    const n = this.grabTrail.length;
    if (n >= 2) {
      const a = this.grabTrail[0], b = this.grabTrail[n - 1];
      const dt = Math.max(0.016, b.t - a.t);
      vx = (b.x - a.x) / dt;
      vy = (b.y - a.y) / dt;
      const sp = Math.sqrt(vx * vx + vy * vy);
      const max = 2300;
      if (sp > max) { vx *= max / sp; vy *= max / sp; }
    }
    const dt = 1 / 60;
    for (let i = 0; i < g.n; i++) {
      const nd = g.nodes[i];
      nd.px = nd.x - vx * dt;
      nd.py = nd.y - vy * dt;
    }
    g.center.px = g.center.x - vx * dt;
    g.center.py = g.center.y - vy * dt;
    g.release();
    const speed = Math.sqrt(vx * vx + vy * vy);
    if (speed > 240) {
      g.squash(vx / speed, vy / speed, -0.18); // stretch along motion (negative squash)
      this.audio.boing(Util.clamp(speed / 1600, 0.25, 1));
    }
    if (this.tutorial && !this.tutorial.done && this.tutorial.step === 2 && speed > 200) {
      this._finishTutorial();
    }
    this.grabbed = null;
    this.grabbedPid = null;
    this.grabTrail = [];
  }

  _grab(c, x, y, pid) {
    c.grab(x, y);
    this.grabbed = c;
    this.grabbedPid = pid;
    this.grabTrail = [{ x, y, t: this.time }];
    this.grabStartT = this.time;
    this.petT = 0.5;
    if (c.sleeping) c.wake(this);
    this.audio.squelch();
    const cc = c.centroid(Game._c);
    this.world.particles.ring(cc.x, cc.y, '#ffffff', c.restR * 0.8);
    if (this.tutorial && !this.tutorial.done && this.tutorial.step === 0) {
      this.tutorial.step = 1;
      this.audio.uiClick();
    }
  }

  _creatureAt(x, y, extra) {
    for (let i = this.creatures.length - 1; i >= 0; i--) {
      const c = this.creatures[i];
      if (c.dead) continue;
      const cc = c.centroid(Game._c);
      if (Util.dist(x, y, cc.x, cc.y) < c.restR * 1.25 + (extra || 0)) return c;
    }
    return null;
  }

  _handleWorldsTap(x, y) {
    for (let i = 0; i < DIORAMAS.length; i++) {
      const col = i % 2, row = Math.floor(i / 2);
      const rx = 40 + col * 380, ry = 190 + row * 274;
      if (x > rx && x < rx + 340 && y > ry && y < ry + 250) {
        this.audio.uiClick();
        this.loadDiorama(i);
        return;
      }
    }
  }

  _skipTutorial() {
    this.tutorial.done = true;
    this.tutorial = null;
    this.save.tutorialDone = true;
    this.persist();
    this.toast('Tutorial skipped — have fun!');
  }
  _finishTutorial() {
    this.tutorial.done = true;
    this.tutorial = null;
    this.save.tutorialDone = true;
    this.persist();
    this.toast('You did it! Now explore!');
    this.audio.giggle();
  }

  /* ---------- update ---------- */
  update(dt) {
    this.time += dt;
    // toasts
    for (let i = this.toasts.length - 1; i >= 0; i--) {
      const t = this.toasts[i];
      t.t += dt; t.life -= dt;
      if (t.life <= 0) this.toasts.splice(i, 1);
    }
    for (const b of this.buttons) b.update(dt);
    if (this.screen !== 'play' || !this.world) return;

    // creature AI before physics
    for (const c of this.creatures) c.updateAI(dt, this);
    this.world.update(dt);
    // toys react after physics
    for (const toy of this.toys) {
      try { toy.update(dt, this.world, this); } catch (e) { if (typeof console !== 'undefined') console.error('toy', e); }
    }
    if (this.overlay === 'mixer') this.mixer.update(dt);

    // per-frame giggle checks
    for (const c of this.creatures) {
      if (c.dead) continue;
      const cc = c.centroid(Game._c);
      const st = c.stretch();
      if (st > c.maxStretchSeen) c.maxStretchSeen = st;
      if (st > 1.8 && !c.userData.stretchNotified) {
        c.userData.stretchNotified = true;
        this.bus.emit('stretch-max', { creature: c, amount: st });
      }
      if (cc.y < 260 && !c.userData.highNotified) {
        c.userData.highNotified = true;
        this.bus.emit('high', { creature: c });
      }
      if (c.sleeping) {
        c.userData.napT = (c.userData.napT || 0) + dt;
        if (c.userData.napT > 8 && !c.userData.napNotified) {
          c.userData.napNotified = true;
          this.bus.emit('nap', { creature: c });
        }
      } else {
        c.userData.napT = 0;
      }
    }
    // tutorial: stretch step is checked here (physics has responded by now)
    if (this.tutorial && !this.tutorial.done && this.tutorial.step === 1 &&
        this.grabbed && this.grabbed.stretch() > 1.4) {
      this.tutorial.step = 2;
      this.audio.uiClick();
    }
    // tutorial target tracking
    if (this.tutorial && !this.tutorial.done) {
      if (!this.tutorial.target || this.tutorial.target.dead) {
        let best = null, bd = Infinity;
        for (const c of this.creatures) {
          const cc = c.centroid(Game._c);
          const d = Util.dist2(cc.x, cc.y, STAGE_W / 2, 700);
          if (d < bd) { bd = d; best = c; }
        }
        this.tutorial.target = best;
      }
    }
    // motes drift
    for (const m of this.motes) {
      m.ph += dt * 0.8;
      m.y -= m.sp * dt;
      m.x += Math.sin(m.ph) * 12 * dt;
      if (m.y < 40) { m.y = STAGE_H - 60; m.x = Util.rand(40, STAGE_W - 40); }
    }
  }

  /* ---------- render ---------- */
  _fillUIBackground(ctx, top, bottom) {
    const g = ctx.createLinearGradient(0, 0, 0, this.ch);
    g.addColorStop(0, top); g.addColorStop(1, bottom);
    ctx.fillStyle = g; ctx.fillRect(0, 0, this.cw, this.ch);
  }

  render() {
    const ctx = this.ctx;
    const useFit = this._uiFit(); // menus + overlays: FIT (never crop a button)
    // device-space background
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if (this.screen === 'play' && !useFit) {
      const d = DIORAMAS[this.dioramaIndex];
      this._fillUIBackground(ctx, d.sky[0], d.sky[1]);
    } else if (this.screen === 'play') {
      const d = DIORAMAS[this.dioramaIndex];
      this._fillUIBackground(ctx, d.sky[0], d.sky[1]);
    } else if (this.screen === 'title') {
      this._fillUIBackground(ctx, '#ffe3ef', '#ffd0e3');
    } else if (this.screen === 'howto') {
      this._fillUIBackground(ctx, '#e3f2ff', '#cfe8ff');
    } else if (this.screen === 'worlds') {
      this._fillUIBackground(ctx, '#f3e8ff', '#e0d0f5');
    } else {
      this._fillUIBackground(ctx, '#ffeef5', '#ffd9e8');
    }
    // stage/UI space
    if (useFit) {
      const t = this._fitOverlay();
      ctx.setTransform(this.dpr * t.s, 0, 0, this.dpr * t.s, this.dpr * t.ox, this.dpr * t.oy);
    } else {
      ctx.setTransform(this.dpr * this.scale, 0, 0, this.dpr * this.scale, this.dpr * this.ox, this.dpr * this.oy);
    }
    if (this.screen === 'boot') {
      this._drawBoot(ctx);
    } else if (this.screen === 'title') {
      drawTitle(ctx, this);
      this._drawButtons(ctx, 'stage');
    } else if (this.screen === 'howto') {
      drawHowto(ctx, this);
      this._drawButtons(ctx, 'stage');
    } else if (this.screen === 'worlds') {
      drawWorlds(ctx, this);
      this._drawButtons(ctx, 'stage');
    } else if (this.screen === 'play' && this.world) {
      if (!useFit) {
        const d = DIORAMAS[this.dioramaIndex];
        try { d.decor(ctx, this, this.time); } catch (e) { /* decor never breaks the game */ }
        // motes behind toys
        ctx.fillStyle = '#ffffff';
        for (const m of this.motes) {
          ctx.globalAlpha = 0.35 + Math.sin(m.ph) * 0.15;
          ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill();
        }
        ctx.globalAlpha = 1;
        for (const toy of this.toys) {
          try { toy.draw(ctx, this); } catch (e) { if (typeof console !== 'undefined') console.error('toy draw', e); }
        }
        // goo balls under creatures
        for (const b of this.world.blobs) {
          if (b instanceof GooBall) { try { b.draw(ctx, this); } catch (e) {} }
        }
        for (const c of this.creatures) {
          if (!c.dead) { try { c.draw(ctx, this); } catch (e) { if (typeof console !== 'undefined') console.error('creature draw', e); } }
        }
        this.world.particles.draw(ctx);
        drawTutorial(ctx, this);
        this._drawButtons(ctx, 'stage');
      } else {
        // modal overlay over the play screen: draw its own dim panel
        if (this.overlay === 'journal') { drawJournal(ctx, this); this._drawButtons(ctx, 'stage'); }
        else if (this.overlay === 'mixer') { this.mixer.draw(ctx); }
      }
    }
    // device space: HUD + device buttons + toasts
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if (this.screen === 'play' && !this.overlay) drawHUD(ctx, this);
    if (this.screen === 'play' && !this.overlay) drawTutorialBubble(ctx, this);
    if (!this.overlay) this._drawButtons(ctx, 'device');
    drawToasts(ctx, this);
  }

  _drawButtons(ctx, space) {
    for (const b of this.buttons) {
      if ((b.space || 'stage') === space) b.draw(ctx, this);
    }
  }

  _drawBoot(ctx) {
    ctx.fillStyle = '#ffeef5';
    ctx.fillRect(0, 0, STAGE_W, STAGE_H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (this.bootError) {
      ctx.fillStyle = '#d14e7f';
      ctx.font = 'bold 34px "Baloo 2", sans-serif';
      ctx.fillText('Oh no! Something wobbled wrong.', STAGE_W / 2, 480);
      ctx.fillStyle = '#7a6a8f';
      ctx.font = '24px "Baloo 2", sans-serif';
      ctx.fillText(String(this.bootError).slice(0, 60), STAGE_W / 2, 540);
    } else {
      drawMascot(ctx, STAGE_W / 2, 480, 80, '#ff8fb3', this.time, 'bouncy');
      ctx.fillStyle = '#4a3b5c';
      ctx.font = 'bold 40px "Baloo 2", sans-serif';
      ctx.fillText('Wobble World', STAGE_W / 2, 640);
      // progress bar
      const bw = 440;
      ctx.fillStyle = 'rgba(74,59,92,0.12)';
      Util.rr(ctx, STAGE_W / 2 - bw / 2, 720, bw, 36, 18);
      ctx.fill();
      const p = Util.clamp(this.bootProgress, 0, 1);
      if (p > 0.01) {
        const g = ctx.createLinearGradient(0, 720, 0, 756);
        g.addColorStop(0, '#ff9ebb'); g.addColorStop(1, '#ff6f9f');
        ctx.fillStyle = g;
        Util.rr(ctx, STAGE_W / 2 - bw / 2 + 4, 724, (bw - 8) * p, 28, 14);
        ctx.fill();
      }
      ctx.fillStyle = '#7a6a8f';
      ctx.font = '24px "Baloo 2", sans-serif';
      ctx.fillText('Warming up the jelly... ' + Math.round(p * 100) + '%', STAGE_W / 2, 790);
    }
  }

  /* ---------- main loop ---------- */
  loop(tms) {
    if (this.testMode) return;
    const now = tms / 1000;
    if (!this._lastT) this._lastT = now;
    let dt = now - this._lastT;
    this._lastT = now;
    if (dt > 0.06) dt = 0.06;
    if (dt < 0) dt = 0;
    try {
      this.update(dt);
      this.render();
    } catch (e) {
      if (typeof console !== 'undefined') console.error('frame', e);
    }
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame((t) => this.loop(t));
    }
  }
  start() {
    if (this.testMode) return;
    this._lastT = 0;
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame((t) => this.loop(t));
    }
  }

  /* ---------- test hooks ---------- */
  testStep(n, dt) {
    dt = dt || 1 / 60;
    for (let i = 0; i < n; i++) this.update(dt);
  }
  testDown(sx, sy) { this.handleDown(this.ox + sx * this.scale, this.oy + sy * this.scale, 'test'); }
  testMove(sx, sy) { this.handleMove(this.ox + sx * this.scale, this.oy + sy * this.scale, 'test'); }
  testUp(sx, sy) { this.handleUp(this.ox + sx * this.scale, this.oy + sy * this.scale, 'test'); }
}
Game._c = {};
/* ===== 09-boot.js ===== */
'use strict';
/* WOBBLE WORLD — 09-boot.js : staged loader with honest progress + retry.
   Exposes WobbleTest hooks for the Node QA harness. */

(function () {
  function tick() { return new Promise(function (r) { setTimeout(r, 25); }); }

  function showFatal(game, err) {
    game.bootError = err && err.message ? err.message : String(err);
    try {
      if (typeof document !== 'undefined') {
        UIOverlay.show(
          '<div class="ov-card"><h2>Oh no! The jelly got stuck.</h2>' +
          '<p>Something went wrong while warming up. Check your connection and try again.</p>' +
          '<div class="ov-row"><button class="ov-btn" id="ov-retry">Try Again</button></div></div>'
        );
        document.getElementById('ov-retry').onclick = function () { location.reload(); };
      }
    } catch (e) { /* ignore */ }
  }

  async function boot() {
    let game = null;
    try {
      const canvas = document.getElementById('game');
      if (!canvas) throw new Error('game canvas missing');
      game = new Game(canvas);
      if (typeof window !== 'undefined') window.__wobbleGame = game;
      game.start(); // rAF loop draws the boot screen with live progress

      game.bootProgress = 0.08; await tick();
      // validate the world data before anyone plays
      if (!DIORAMAS || DIORAMAS.length !== 6) throw new Error('world data missing');
      let giggleCount = 0;
      for (const d of DIORAMAS) {
        if (!d.giggles || d.giggles.length !== 3) throw new Error('world "' + d.name + '" needs 3 giggle moments');
        giggleCount += d.giggles.length;
      }
      if (giggleCount !== GIGGLE_TOTAL) throw new Error('giggle moment count mismatch');
      game.bootProgress = 0.4; await tick();
      // warm the physics with a tiny throwaway world (catches engine regressions early)
      const warm = new World(STAGE_W, STAGE_H);
      warm.addBounds();
      const wb = new SoftBlob(400, 600, 40, 10, { color: '#ff8fb3' });
      warm.blobs.push(wb);
      for (let i = 0; i < 30; i++) warm.step(1 / 60);
      if (!isFinite(wb.center.x) || wb.area() < 1) throw new Error('physics warm-up failed');
      game.bootProgress = 0.7; await tick();
      // audio can only unlock on a real user gesture; nothing to preload
      game.bootProgress = 0.9; await tick();
      game.bootProgress = 1;
      await tick();
      game.setScreen('title');
    } catch (err) {
      if (typeof console !== 'undefined') console.error('boot failed:', err);
      if (game) showFatal(game, err);
    }
  }

  // surface unexpected runtime errors on the boot screen instead of a dead page
  if (typeof window !== 'undefined') {
    window.addEventListener('error', function (e) {
      const game = window.__wobbleGame;
      if (game && game.screen === 'boot') showFatal(game, e.error || e.message);
    });
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  }

  // ---- test hooks (browser window + Node vm) ----
  try {
    globalThis.WobbleTest = {
      Game, Bus, World, SoftBlob, JellyBlock, Particles, Creature, Mixer,
      DIORAMAS, PERSONALITIES, GOO_COLORS, GIGGLE_TOTAL, Util,
      Trampoline, DominoTower, MagnetOrb, GooBall, Seesaw, GooPool,
      BubblePipe, Bubble, SpringFlower, Pillow, GooJar, JellyAudio
    };
  } catch (e) { /* ignore */ }
})();
</script>
