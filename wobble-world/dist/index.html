<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffe3ef">
<title>Wobble World</title>
<style>
/* WOBBLE WORLD — page styles (all game visuals are canvas-drawn) */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #ffeef5;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  font-family: "Baloo 2", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
}
#game {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  display: block;
  touch-action: none;
  cursor: pointer;
}
/* DOM overlay: name input + snapshot card (canvas handles everything else) */
#overlay {
  position: fixed; inset: 0;
  display: none;
  align-items: center; justify-content: center;
  background: rgba(74, 59, 92, 0.45);
  z-index: 20;
  padding: 24px;
}
#overlay.show { display: flex; }
.ov-card {
  background: #fff7fb;
  border-radius: 28px;
  padding: 28px 26px;
  width: min(420px, 92vw);
  text-align: center;
  box-shadow: 0 18px 60px rgba(74, 59, 92, 0.35);
  border: 4px solid #ffd6e8;
  animation: ovpop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes ovpop {
  from { transform: scale(0.7); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}
.ov-card h2 {
  color: #4a3b5c; font-size: 26px; margin-bottom: 8px;
}
.ov-card p {
  color: #7a6a8f; font-size: 16px; margin-bottom: 14px;
}
.ov-card input[type="text"] {
  width: 100%;
  font-size: 22px; text-align: center;
  padding: 12px 14px;
  border-radius: 18px;
  border: 3px solid #ffd6e8;
  background: #ffffff;
  color: #4a3b5c;
  font-family: inherit;
  outline: none;
  margin-bottom: 16px;
}
.ov-card input[type="text"]:focus { border-color: #ff8fb3; }
.ov-row { display: flex; gap: 12px; justify-content: center; }
.ov-btn {
  font-family: inherit;
  font-size: 18px; font-weight: 700;
  color: #fff;
  background: linear-gradient(180deg, #ff9ebb, #ff6f9f);
  border: none; border-radius: 18px;
  padding: 12px 26px;
  cursor: pointer;
  box-shadow: 0 6px 0 #d14e7f;
  transition: transform 0.08s;
}
.ov-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d14e7f; }
.ov-btn.secondary {
  background: linear-gradient(180deg, #cfc3ec, #a893d8);
  box-shadow: 0 6px 0 #7d68ad;
  color: #fff;
}
.ov-btn.secondary:active { box-shadow: 0 2px 0 #7d68ad; }
.ov-card img.snapshot {
  width: 100%; border-radius: 18px;
  border: 3px solid #ffd6e8;
  margin-bottom: 14px;
  display: block;
}
.ov-card a.dl {
  display: inline-block;
  font-size: 16px; color: #d14e7f; font-weight: 700;
  margin-bottom: 12px; text-decoration: none;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay"></div>
<script>
/* ===== 00-util.js ===== */
'use strict';
/* WOBBLE WORLD — 00-util.js : math, easing, color helpers */

const TAU = Math.PI * 2;
const STAGE_W = 800;
const STAGE_H = 1200;

const Util = {
  clamp(v, a, b) { return v < a ? a : (v > b ? b : v); },
  lerp(a, b, t) { return a + (b - a) * t; },
  rand(a, b) { return a + Math.random() * (b - a); },
  randi(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  chance(p) { return Math.random() < p; },
  dist(x1, y1, x2, y2) { const dx = x2 - x1, dy = y2 - y1; return Math.sqrt(dx * dx + dy * dy); },
  dist2(x1, y1, x2, y2) { const dx = x2 - x1, dy = y2 - y1; return dx * dx + dy * dy; },

  easeOutCubic(t) { t = Util.clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); },
  easeInOutQuad(t) { t = Util.clamp(t, 0, 1); return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; },
  easeOutBack(t) {
    t = Util.clamp(t, 0, 1);
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  },
  easeOutElastic(t) {
    t = Util.clamp(t, 0, 1);
    if (t === 0 || t === 1) return t;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1;
  },

  // angle helpers
  angDiff(a, b) {
    let d = (b - a) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  },
  angLerp(a, b, t) { return a + Util.angDiff(a, b) * Util.clamp(t, 0, 1); },

  // ---- color helpers (hex like '#ff8fb3') ----
  hexToRgb(hex) {
    const h = hex.replace('#', '');
    const v = h.length === 3
      ? h.split('').map(c => c + c).join('')
      : h;
    return {
      r: parseInt(v.substr(0, 2), 16),
      g: parseInt(v.substr(2, 2), 16),
      b: parseInt(v.substr(4, 2), 16)
    };
  },
  rgba(hex, a) {
    const c = Util.hexToRgb(hex);
    return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + a + ')';
  },
  mixHex(h1, h2, t) {
    const a = Util.hexToRgb(h1), b = Util.hexToRgb(h2);
    const r = Math.round(Util.lerp(a.r, b.r, t));
    const g = Math.round(Util.lerp(a.g, b.g, t));
    const bl = Math.round(Util.lerp(a.b, b.b, t));
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
  },
  // amt: -100 (black) .. +100 (white)
  shade(hex, amt) {
    const c = Util.hexToRgb(hex);
    const f = amt / 100;
    const t = v => Math.round(Util.clamp(f > 0 ? v + (255 - v) * f : v * (1 + f), 0, 255));
    const r = t(c.r), g = t(c.g), b = t(c.b);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  },

  now() {
    return (typeof performance !== 'undefined' ? performance.now() : Date.now()) / 1000;
  },

  // roundRect path helper (works even where ctx.roundRect is missing)
  rr(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  },

  // ellipse helper
  ell(ctx, x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU);
  }
};
/* ===== 01-audio.js ===== */
'use strict';
/* WOBBLE WORLD — 01-audio.js : 100% synthesized WebAudio SFX + generative music.
   No samples, no external files. Everything is guarded so the game runs fine
   with audio disabled (Node test harness, muted browsers). */

class JellyAudio {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.musicGain = null;
    this.muted = false;
    this.musicTimer = null;
    this.chordIdx = 0;
    // gentle I - V - vi - IV in C major, as frequencies
    this.chords = [
      [261.63, 329.63, 392.00],  // C
      [196.00, 246.94, 392.00],  // G
      [220.00, 261.63, 329.63],  // Am
      [174.61, 220.00, 349.23]   // F
    ];
    this.penta = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
  }

  get ready() { return !!this.ctx; }

  // Must be called from a user gesture at least once.
  ensure() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') {
        try { this.ctx.resume(); } catch (e) { /* ignore */ }
      }
      return true;
    }
    try {
      const AC = (typeof window !== 'undefined')
        ? (window.AudioContext || window.webkitAudioContext)
        : null;
      if (!AC) return false;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.9;
      this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.5;
      this.musicGain.connect(this.master);
      return true;
    } catch (e) {
      this.ctx = null;
      return false;
    }
  }

  setMuted(m) {
    this.muted = !!m;
    if (this.master && this.ctx) {
      this.master.gain.setTargetAtTime(this.muted ? 0 : 0.9, this.ctx.currentTime, 0.05);
    }
  }

  // --- primitive builders -------------------------------------------------
  _tone(o) {
    if (!this.ctx || this.muted) return;
    try {
      const t0 = this.ctx.currentTime + (o.delay || 0);
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(o.f0 || 440, t0);
      if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t0 + (o.dur || 0.2));
      // wobble LFO on frequency for "boing" feel
      if (o.wobble) {
        const lfo = this.ctx.createOscillator();
        const lg = this.ctx.createGain();
        lfo.frequency.value = o.wobble;
        lg.gain.value = (o.f0 || 440) * 0.25;
        lfo.connect(lg); lg.connect(osc.frequency);
        lfo.start(t0); lfo.stop(t0 + (o.dur || 0.2) + 0.05);
      }
      const vol = o.vol || 0.2, dur = o.dur || 0.2;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + (o.attack || 0.01));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(o.music ? this.musicGain : this.master);
      osc.start(t0); osc.stop(t0 + dur + 0.05);
    } catch (e) { /* never break the game for audio */ }
  }

  _noise(o) {
    if (!this.ctx || this.muted) return;
    try {
      const t0 = this.ctx.currentTime + (o.delay || 0);
      const dur = o.dur || 0.2;
      const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      const flt = this.ctx.createBiquadFilter();
      flt.type = o.ftype || 'lowpass';
      flt.frequency.setValueAtTime(o.f0 || 800, t0);
      if (o.f1) flt.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t0 + dur);
      flt.Q.value = o.q || 0.8;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t0 + (o.attack || 0.01));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(flt); flt.connect(g); g.connect(this.master);
      src.start(t0); src.stop(t0 + dur + 0.05);
    } catch (e) { /* ignore */ }
  }

  // --- SFX ---------------------------------------------------------------
  uiClick() { this._tone({ f0: 700, f1: 900, dur: 0.07, type: 'triangle', vol: 0.12 }); }

  boing(strength) {
    const s = Util.clamp(strength || 0.5, 0.1, 1);
    this._tone({ f0: 160 + s * 120, f1: 90, dur: 0.28, type: 'sine', vol: 0.25 * s + 0.08, wobble: 22 });
    this._tone({ f0: 320 + s * 200, f1: 180, dur: 0.18, type: 'triangle', vol: 0.10 * s, delay: 0.02 });
  }

  splat(hard) {
    const h = hard ? 1 : 0.55;
    this._noise({ dur: 0.16, f0: 900, f1: 220, vol: 0.22 * h });
    this._tone({ f0: 130, f1: 55, dur: 0.18, type: 'sine', vol: 0.22 * h });
  }

  squelch() {
    this._noise({ dur: 0.22, f0: 1400, f1: 350, ftype: 'bandpass', q: 1.6, vol: 0.16 });
    this._tone({ f0: 300, f1: 140, dur: 0.16, type: 'triangle', vol: 0.08, delay: 0.03 });
  }

  giggle() {
    // happy ascending blips
    const notes = [620, 740, 880, 990, 1180];
    for (let i = 0; i < notes.length; i++) {
      this._tone({ f0: notes[i], f1: notes[i] * 1.12, dur: 0.12, type: 'sine', vol: 0.14, delay: i * 0.07 });
    }
  }

  pop() {
    this._tone({ f0: 480, f1: 950, dur: 0.09, type: 'square', vol: 0.07 });
    this._noise({ dur: 0.05, f0: 2500, vol: 0.06 });
  }

  sparkle() {
    const notes = [1320, 1560, 1860];
    for (let i = 0; i < notes.length; i++) {
      this._tone({ f0: notes[i], dur: 0.25, type: 'sine', vol: 0.07, delay: i * 0.05 });
    }
  }

  snap() {
    this._tone({ f0: 900, f1: 1400, dur: 0.08, type: 'triangle', vol: 0.12 });
    this._tone({ f0: 1800, dur: 0.2, type: 'sine', vol: 0.05, delay: 0.05 });
  }

  splash() {
    this._noise({ dur: 0.3, f0: 1800, f1: 500, ftype: 'bandpass', q: 1.1, vol: 0.16 });
    this._tone({ f0: 220, f1: 110, dur: 0.22, type: 'sine', vol: 0.1 });
  }

  stretchSfx(t) {
    // subtle rising whine while stretching (throttled by caller)
    this._tone({ f0: 200 + t * 300, f1: 240 + t * 340, dur: 0.12, type: 'sine', vol: 0.04 });
  }

  wakeUp() {
    const notes = [392, 523, 659];
    for (let i = 0; i < notes.length; i++) {
      this._tone({ f0: notes[i], dur: 0.15, type: 'triangle', vol: 0.12, delay: i * 0.09 });
    }
  }

  // --- generative music ----------------------------------------------------
  startMusic() {
    if (!this.ctx || this.musicTimer) return;
    const playChord = () => {
      if (this.muted || !this.ctx) return;
      const chord = this.chords[this.chordIdx % this.chords.length];
      this.chordIdx++;
      for (let i = 0; i < chord.length; i++) {
        // soft detuned pad voices
        this._tone({ f0: chord[i] * 0.5, dur: 7.5, type: 'triangle', vol: 0.035, music: true, attack: 2.5 });
        this._tone({ f0: chord[i] * 0.5 * 1.003, dur: 7.5, type: 'sine', vol: 0.03, music: true, attack: 2.5 });
      }
      // occasional music-box pluck on the pentatonic
      if (Util.chance(0.75)) {
        const n = Util.pick(this.penta);
        this._tone({ f0: n, dur: 1.6, type: 'sine', vol: 0.045, music: true, attack: 0.01, delay: Util.rand(1, 5) });
        this._tone({ f0: n * 2, dur: 1.2, type: 'sine', vol: 0.018, music: true, attack: 0.01, delay: Util.rand(1, 5) });
      }
    };
    playChord();
    try {
      this.musicTimer = setInterval(() => {
        try { playChord(); } catch (e) { /* ignore */ }
      }, 8000);
    } catch (e) { this.musicTimer = null; }
  }

  stopMusic() {
    if (this.musicTimer) {
      try { clearInterval(this.musicTimer); } catch (e) { /* ignore */ }
      this.musicTimer = null;
    }
  }
}
/* ===== 02-physics.js ===== */
'use strict';
/* WOBBLE WORLD — 02-physics.js : custom 2D soft-body engine.
   Verlet integration + position-based dynamics (distance constraints +
   area-pressure constraint). Stable on phones: fixed timestep, dt clamp,
   zero hot-loop allocation. No library. */

class PNode {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.px = x; this.py = y;
    this.pinned = false;
  }
  vel(dt) { return { x: (this.x - this.px) / dt, y: (this.y - this.py) / dt }; }
}

class Spring {
  constructor(a, b, rest, stiffness) {
    this.a = a; this.b = b;
    this.rest = rest;
    this.k = (stiffness === undefined) ? 1 : stiffness;
  }
  solve() {
    const a = this.a, b = this.b;
    let dx = b.x - a.x, dy = b.y - a.y;
    let d = Math.sqrt(dx * dx + dy * dy);
    if (d < 1e-6) return;
    const diff = (d - this.rest) / d * 0.5 * this.k;
    const wa = a.pinned ? 0 : 1, wb = b.pinned ? 0 : 1;
    const sum = wa + wb;
    if (sum === 0) return;
    const fa = wa / sum, fb = wb / sum;
    a.x += dx * diff * fa;
    a.y += dy * diff * fa;
    b.x -= dx * diff * fb;
    b.y -= dy * diff * fb;
  }
}

/* SoftBlob — a ring of nodes + center node, held together by ring springs,
   spoke springs and an area-pressure constraint. This is the jelly. */
class SoftBlob {
  constructor(x, y, r, n, opts) {
    opts = opts || {};
    this.n = Math.max(6, n | 0);
    this.restR = r;
    this.color = opts.color || '#ff8fb3';
    this.bounce = (opts.bounce === undefined) ? 0.55 : opts.bounce;
    this.pressure = (opts.pressure === undefined) ? 0.55 : opts.pressure;
    this.damping = (opts.damping === undefined) ? 0.985 : opts.damping;
    this.restArea = Math.PI * r * r;
    this.nodes = [];
    this.springs = [];
    for (let i = 0; i < this.n; i++) {
      const a = (i / this.n) * TAU;
      this.nodes.push(new PNode(x + Math.cos(a) * r, y + Math.sin(a) * r));
    }
    this.center = new PNode(x, y);
    const ringRest = 2 * Math.PI * r / this.n;
    for (let i = 0; i < this.n; i++) {
      const a = this.nodes[i], b = this.nodes[(i + 1) % this.n];
      this.springs.push(new Spring(a, b, ringRest, opts.ringK || 0.5));
      this.springs.push(new Spring(this.center, a, r, opts.spokeK || 0.28));
    }
    // shape memory for teardrop/star variants: per-node rest radius multiplier
    this.shapeMul = opts.shapeMul || null;
    if (this.shapeMul) {
      for (let i = 0; i < this.n; i++) {
        const s = this.springs[this.n + i]; // spoke spring i
        s.rest = r * this.shapeMul[i % this.shapeMul.length];
      }
    }
    this.grabNode = -1;
    this.grabX = 0; this.grabY = 0;
    this.dead = false;
    this.userData = {};
  }

  centroid(out) {
    out = out || {};
    let x = 0, y = 0;
    for (let i = 0; i < this.n; i++) { x += this.nodes[i].x; y += this.nodes[i].y; }
    out.x = x / this.n; out.y = y / this.n;
    return out;
  }

  velocity(dt, out) {
    out = out || {};
    out.x = (this.center.x - this.center.px) / dt;
    out.y = (this.center.y - this.center.py) / dt;
    return out;
  }

  radius() {
    const c = this.centroid(SoftBlob._c);
    let r = 0;
    for (let i = 0; i < this.n; i++) {
      r += Util.dist(c.x, c.y, this.nodes[i].x, this.nodes[i].y);
    }
    return r / this.n;
  }

  area() {
    let a = 0;
    for (let i = 0; i < this.n; i++) {
      const p = this.nodes[i], q = this.nodes[(i + 1) % this.n];
      a += p.x * q.y - q.x * p.y;
    }
    return Math.abs(a) * 0.5;
  }

  // stretch = max node distance from centroid / rest radius
  stretch() {
    const c = this.centroid(SoftBlob._c);
    let m = 0;
    for (let i = 0; i < this.n; i++) {
      const d = Util.dist(c.x, c.y, this.nodes[i].x, this.nodes[i].y);
      if (d > m) m = d;
    }
    return m / this.restR;
  }

  nearestNode(x, y) {
    let best = 0, bd = Infinity;
    for (let i = 0; i < this.n; i++) {
      const d = Util.dist2(x, y, this.nodes[i].x, this.nodes[i].y);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }

  grab(x, y) {
    this.grabNode = this.nearestNode(x, y);
    this.grabX = x; this.grabY = y;
  }

  moveGrab(x, y) {
    // clamp how far the finger can pull: stretchy but controllable
    const c = this.centroid(SoftBlob._c);
    const maxD = this.restR * 4.2;
    const dx = x - c.x, dy = y - c.y;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d > maxD && d > 1e-4) {
      this.grabX = c.x + dx / d * maxD;
      this.grabY = c.y + dy / d * maxD;
    } else {
      this.grabX = x; this.grabY = y;
    }
  }
  release() { this.grabNode = -1; }
  get grabbed() { return this.grabNode >= 0; }

  applyImpulse(ix, iy) {
    for (let i = 0; i < this.n; i++) {
      const nd = this.nodes[i];
      nd.px -= ix; nd.py -= iy;
    }
    this.center.px -= ix; this.center.py -= iy;
  }

  // juice: squash along a normal (nx,ny) by amount 0..1
  // NOTE: displaces x AND px equally -> pure shape change, injects no
  // velocity (otherwise every impact would pump energy into the blob).
  squash(nx, ny, amount) {
    const c = this.centroid(SoftBlob._c);
    const k = Util.clamp(amount, 0, 0.6);
    for (let i = 0; i < this.n; i++) {
      const nd = this.nodes[i];
      const dx = nd.x - c.x, dy = nd.y - c.y;
      const along = dx * nx + dy * ny;
      const pxn = -ny, pyn = nx;

    }

    opts = opts || {};

    this.cursor = (this.cursor + 1) % this.max;
    p.active = true; p.type = type;
    p.x = x; p.y = y;
    p.vx = opts.vx || 0; p.vy = opts.vy || 0;
    p.life = 0; p.maxLife = opts.life || 0.6;
    p.size = opts.size || 6;
    p.color = opts.color || '#ffffff';

    p.grav = opts.grav || 0;
    p.text = opts.text || '';

      const p = this.list[i];

      p.life += dt;
      if (p.life >= p.maxLife) { p.active = false; continue; }
      p.vy += p.grav * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;

    for (let i = 0; i < this.max; i++) {

      if (p.type === 'ring') {
        ctx.globalAlpha = (1 - t) * 0.8;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 4 * (1 - t) + 1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.3 + t * 1.4), 0, TAU);
        ctx.stroke();

          const a = (k / 8) * TAU;
          const rr = (k % 2 === 0) ? s : s * 0.45;
          ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
        }
        ctx.closePath(); ctx.fill();
        ctx.restore();
      } else if (p.type === 'sparkle') {
        ctx.globalAlpha = 1 - t;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 2;
        const s = p.size * (0.4 + t);
        ctx.beginPath();
        ctx.moveTo(p.x - s, p.y); ctx.lineTo(p.x + s, p.y);
        ctx.moveTo(p.x, p.y - s); ctx.lineTo(p.x, p.y + s);
        ctx.stroke();
      } else if (p.type === 'drip' || p.type === 'mote' || p.type === 'poof') {
        ctx.globalAlpha = p.type === 'mote' ? 0.5 * (1 - t) : (1 - t) * 0.85;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (p.type === 'poof' ? (0.5 + t) : (1 - t * 0.4)), 0, TAU);
        ctx.fill();
      } else if (p.type === 'text') {
        ctx.globalAlpha = 1 - t;
        ctx.fillStyle = p.color;
        ctx.font = 'bold ' + Math.round(p.size) + 'px "Baloo 2", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(p.text, p.x, p.y - t * 60);

        ctx.fill(); ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    this.faceT = 0;
    this.wakeFlash = 0;
    this.paintColors = [];    // hexes this creature has been painted with
    this.labelT = 0;          // show name label countdown
    this.ridingBubble = null;
    this.userData.isCreature = true;
    this.userData.creature = this;
  }

  get isSleepy() { return this.pKey === 'sleepy'; }

  paint(goo, game) {
    const before = this.color;
    this.color = Util.mixHex(this.color, goo.hex, 0.55);
    this.bounce = Util.clamp(this.bounce + goo.bounceUp, 0.15, 0.95);
    this.stickiness = Util.clamp(this.stickiness + goo.stickyUp, 0, 1);
    this.energy = Util.clamp(this.energy + goo.energyUp, 0.1, 1.2);
    if (this.paintColors.indexOf(goo.hex) < 0) this.paintColors.push(goo.hex);
    const c = this.centroid(Creature._c);
    game.world.particles.spawn('poof', c.x, c.y, { life: 0.5, size: 26, color: goo.hex, grav: -60 });
    game.world.particles.ring(c.x, c.y, '#ffffff', this.restR);
    game.audio.squelch();
    game.bus.emit('paint', { creature: this, color: goo.hex, before });
    this.squash(0, -1, 0.25); // happy squish
  }

  wake(game) {
    if (!this.sleeping) return;
    this.sleeping = false;
    this.sleepTimer = 0;
    this.wakeFlash = 0.8;
    this.aiTimer = Util.rand(0.4, 1);
    const c = this.centroid(Creature._c);
    game.world.particles.spawn('text', c.x, c.y - 40, { life: 0.9, size: 30, color: '#ffffff', text: '!' });
    game.audio.wakeUp();
    game.bus.emit('wake', { creature: this });
    this.squash(0, -1, 0.3);
  }

  poke(x, y, game) {
    // second-finger poke: gentle impulse + boing
    const c = this.centroid(Creature._c);
    const dx = c.x - x, dy = c.y - y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const power = 320;
    this.applyImpulse(dx / d * power * 0.016, dy / d * power * 0.016 - 4);
    if (this.sleeping) this.wake(game);
    game.audio.boing(0.35);
    game.world.particles.ring(c.x, c.y, '#ffffff', this.restR * 0.9);
    this.squash(dx / d, dy / d, 0.3);
  }

  // ---- per-frame ----
  updateAI(dt, game) {
    this.faceT += dt;
    this.faceBlink -= dt;
    if (this.faceBlink < -0.12) this.faceBlink = Util.rand(1.6, 4);
    if (this.spawnT < 1) this.spawnT = Math.min(1, this.spawnT + dt * 2.2);
    if (this.splatCooldown > 0) this.splatCooldown -= dt;
    if (this.wakeFlash > 0) this.wakeFlash -= dt;
    if (this.labelT > 0) this.labelT -= dt;

    const c = this.centroid(Creature._c);

    // safety net: nothing in this toy box may ever exceed 2400 px/s
    const sv = this.velocity(dt, Creature._v);
    const ssp = Math.sqrt(sv.x * sv.x + sv.y * sv.y);
    if (ssp > 2400) {
      const f = 2400 / ssp;
      for (let i = 0; i < this.n; i++) {
        const nd = this.nodes[i];
        nd.px = nd.x - (nd.x - nd.px) * f;
        nd.py = nd.y - (nd.y - nd.py) * f;
      }
      this.center.px = this.center.x - (this.center.x - this.center.px) * f;
      this.center.py = this.center.y - (this.center.y - this.center.py) * f;
    }

    // riding a bubble: follow it, skip gravity AI
    if (this.ridingBubble) {
      const b = this.ridingBubble;
      if (b.dead) { this.ridingBubble = null; }
      else {
        const tx = b.x, ty = b.y + 6;
        for (let i = 0; i < this.n; i++) {
          const nd = this.nodes[i];
          nd.px = nd.x; nd.py = nd.y;
        }
        this.center.px = this.center.x; this.center.py = this.center.y;
        const k = 1 - Math.pow(0.0001, dt);
        for (let i = 0; i < this.n; i++) {
          const nd = this.nodes[i];
          const ox = nd.x - this.center.x, oy = nd.y - this.center.y;
          this.center.x += (tx - this.center.x) * k;
          this.center.y += (ty - this.center.y) * k;
          nd.x = this.center.x + ox; nd.y = this.center.y + oy;
        }
        return;
      }
    }

    // sticky cling: freeze briefly after landing
    if (this.stickTimer > 0) {
      this.stickTimer -= dt;
      for (let i = 0; i < this.n; i++) {
        const nd = this.nodes[i];
        nd.px = nd.x; nd.py = nd.y;
      }
      this.center.px = this.center.x; this.center.py = this.center.y;
      return;
    }

    if (this.grabbed) return; // player is driving

    // sleepy behavior
    if (this.isSleepy) {
      const v = this.velocity(dt, Creature._v);
      const speed = Math.sqrt(v.x * v.x + v.y * v.y);
      if (!this.sleeping && speed < 60) {
        this.sleepTimer += dt;
        if (this.sleepTimer > 2.5) {
          this.sleeping = true;
          game.bus.emit('sleep', { creature: this });
        }
      } else if (speed >= 60) {
        this.sleepTimer = 0;
      }
      if (this.sleeping) {
        this.zzzTimer -= dt;
        if (this.zzzTimer <= 0) {
          this.zzzTimer = Util.rand(0.7, 1.2);
          game.world.particles.spawn('text', c.x + 20, c.y - this.restR - 6,
            { life: 1.6, size: 22, color: '#ffffff', text: 'Z', vy: -40 });
        }
        return; // no hopping while asleep
      }
    }

    // wander hops — only when grounded (no mid-air energy pumping);
    // in the air, just a tiny wiggle
    this.aiTimer -= dt * (0.6 + this.energy);
    if (this.aiTimer <= 0) {
      const p = this.personality;
      this.aiTimer = Util.rand(p.hopInterval[0], p.hopInterval[1]);
      if (!this._isGrounded(game)) {
        this.applyImpulse(this.hopDir * 30 * 0.016, 0);
        return;
      }
      if (Util.chance(0.25)) this.hopDir *= -1;
      // stay roughly in the middle band of the stage
      if (c.x < 180) this.hopDir = 1;
      if (c.x > STAGE_W - 180) this.hopDir = -1;
      const power = p.hopPower * (0.7 + this.energy * 0.5);
      this.applyImpulse(this.hopDir * power * 0.016 * Util.rand(0.6, 1),
        -power * 0.016 * Util.rand(0.7, 1.1));
      // anticipation squash before hop
      this.squash(0, 1, 0.18);
    }
  }

  _isGrounded(game) {
    const c = this.centroid(Creature._c);
    const cp = Creature._cp;
    const px = c.x, py = c.y + this.restR * 0.9;
    const statics = game.world.statics;
    for (let i = 0; i < statics.length; i++) {
      const s = statics[i];
      World.closestPointOnSeg(px, py, s.x1, s.y1, s.x2, s.y2, cp);
      if (Util.dist(px, py, cp.x, cp.y) < 30) return true;
    }
    return false;
  }

  onLanded(impact, nx, ny, game) {
    // called by Game via world.onImpact for strong impacts
    // sticky cling: its own moment, independent of splat — wide window so it
    // triggers reliably on ordinary landings
    if (this.stickiness > 0.45 && impact > 150 && impact < 1100 && this.stickTimer <= 0) {
      this.stickTimer = 0.9;
      game.bus.emit('stick', { creature: this });
    }
    if (impact > 260 && this.splatCooldown <= 0) {
      this.splatCooldown = 0.4;
      const hard = impact > 700;
      game.audio.splat(hard);
      const c = this.centroid(Creature._c);
      const n = hard ? 5 : 3;
      for (let i = 0; i < n; i++) {
        game.world.particles.spawn('star', c.x + Util.rand(-20, 20), c.y + Util.rand(-10, 10),
          { life: 0.5, size: Util.rand(6, 12), color: '#ffffff', vx: Util.rand(-90, 90), vy: Util.rand(-140, -20), grav: 500, rot: Util.rand(0, 6), vr: Util.rand(-6, 6) });
      }
      game.world.particles.ring(c.x, c.y + this.restR * 0.5, '#ffffff', this.restR);
      game.bus.emit('splat', { creature: this, impact, hard });
      if (hard && this.sleeping) this.wake(game);
    }
  }

  // ---- drawing ----
  draw(ctx, game) {
    const c = this.centroid(Creature._c);
    const t = game.time;
    // spawn scale-in with overshoot
    const sIn = this.spawnT < 1 ? Util.easeOutBack(this.spawnT) : 1;
    const wakeJiggle = this.wakeFlash > 0 ? Math.sin(t * 40) * 0.06 * this.wakeFlash : 0;
    const hyperJiggle = this.pKey === 'hyper' && !this.sleeping ? Math.sin(t * 30) * 0.02 : 0;

    // soft shadow on the floor
    const floorY = STAGE_H - 40;
    const hAbove = Util.clamp((floorY - c.y) / 700, 0, 1);
    ctx.globalAlpha = 0.16 * (1 - hAbove * 0.7);
    ctx.fillStyle = '#4a3b5c';
    Util.ell(ctx, c.x, floorY + 14, this.restR * 1.05 * sIn, 14 * sIn);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(sIn * (1 + wakeJiggle + hyperJiggle), sIn * (1 - wakeJiggle));

    // body path through nodes (relative coords)
    const pts = [];
    for (let i = 0; i < this.n; i++) pts.push({ x: this.nodes[i].x - c.x, y: this.nodes[i].y - c.y });
    this._tracePath(ctx, pts);

    const R = this.restR;
    // body gradient
    const g = ctx.createLinearGradient(0, -R, 0, R);
    g.addColorStop(0, Util.shade(this.color, 38));
    g.addColorStop(0.45, this.color);
    g.addColorStop(1, Util.shade(this.color, -16));
    ctx.globalAlpha = 0.93;
    ctx.fillStyle = g;
    ctx.fill();
    ctx.globalAlpha = 1;
    // rim
    ctx.strokeStyle = Util.rgba(Util.shade(this.color, -32), 0.55);
    ctx.lineWidth = Math.max(2, R * 0.055);
    ctx.stroke();
    // inner glow (subsurface fake)
    ctx.save();
    ctx.translate(-R * 0.08, -R * 0.12);
    ctx.scale(0.72, 0.72);
    this._tracePath(ctx, pts);
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.fill();
    ctx.restore();
    // refraction highlight
    ctx.save();
    ctx.translate(-R * 0.34, -R * 0.42);
    ctx.rotate(-0.5);
    const hg = ctx.createRadialGradient(0, 0, 1, 0, 0, R * 0.42);
    hg.addColorStop(0, 'rgba(255,255,255,0.6)');
    hg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.ellipse(0, 0, R * 0.42, R * 0.24, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
    // specular dot
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(-R * 0.42, -R * 0.55, Math.max(2, R * 0.07), 0, TAU);
    ctx.fill();

    // sticky drips
    if (this.stickiness > 0.4) {
      ctx.fillStyle = Util.shade(this.color, 10);
      const drips = 3;
      for (let i = 0; i < drips; i++) {
        const a = Math.PI * (0.25 + i * 0.25) + Math.sin(t * 2 + i) * 0.05;
        const dx = Math.cos(a) * R * 0.75, dy = Math.sin(a) * R * 0.85;
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.arc(dx, dy + Math.sin(t * 3 + i * 2) * 3, R * 0.12, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    this._drawFace(ctx, R, t, game);
    ctx.restore();

    // name label (mixer creations)
    if (this.labelT > 0 && this.customName) {
      ctx.globalAlpha = Math.min(1, this.labelT);
      ctx.font = 'bold 24px "Baloo 2", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      const w = ctx.measureText(this.displayName).width + 28;
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      Util.rr(ctx, c.x - w / 2, c.y - R - 52, w, 36, 18);
      ctx.fill();
      ctx.fillStyle = '#4a3b5c';
      ctx.fillText(this.displayName, c.x, c.y - R - 22);
      ctx.globalAlpha = 1;
    }
  }

  _tracePath(ctx, pts) {
    const n = pts.length;
    ctx.beginPath();
    ctx.moveTo((pts[0].x + pts[n - 1].x) / 2, (pts[0].y + pts[n - 1].y) / 2);
    for (let i = 0; i < n; i++) {
      const p = pts[i], q = pts[(i + 1) % n];
      ctx.quadraticCurveTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2);
    }
    ctx.closePath();
  }

  _drawFace(ctx, R, t, game) {
    const v = this.velocity(1 / 60, Creature._v2);
    const sp = Math.sqrt(v.x * v.x + v.y * v.y);
    const lookX = Util.clamp(v.x / 400, -1, 1) * R * 0.12;
    const lookY = Util.clamp(v.y / 400, -1, 1) * R * 0.08;
    const stretch = this.stretch();
    const blink = this.faceBlink < 0 ? 0.12 : 1; // eyelid scale
    const eyeDX = R * 0.34, eyeY = -R * 0.12;

    if (this.sleeping) {
      // closed happy arcs
      ctx.strokeStyle = '#4a3b5c';
      ctx.lineWidth = Math.max(2.5, R * 0.05);
      ctx.lineCap = 'round';
      for (const sx of [-1, 1]) {
        ctx.beginPath();
        ctx.arc(sx * eyeDX, eyeY, R * 0.14, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();
      }
    } else if (this.pKey === 'hyper') {
      // excited > < eyes
      ctx.strokeStyle = '#4a3b5c';
      ctx.lineWidth = Math.max(3, R * 0.06);
      ctx.lineCap = 'round';
      for (const sx of [-1, 1]) {
        const ex = sx * eyeDX + lookX, ey = eyeY + lookY;
        const s = R * 0.16;
        ctx.beginPath();
        ctx.moveTo(ex - s * sx, ey - s); ctx.lineTo(ex, ey); ctx.lineTo(ex - s * sx, ey + s);
        ctx.stroke();
      }
    } else {
      // round eyes with pupils
      for (const sx of [-1, 1]) {
        const ex = sx * eyeDX + lookX * 0.6, ey = eyeY + lookY * 0.6;
        const er = R * (this.pKey === 'bouncy' ? 0.2 : 0.16);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(ex, ey, er, er * blink, 0, 0, TAU);
        ctx.fill();
        if (blink > 0.5) {
          ctx.fillStyle = '#4a3b5c';
          ctx.beginPath();
          ctx.arc(ex + lookX, ey + lookY, er * 0.45, 0, TAU);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(ex + lookX - er * 0.12, ey + lookY - er * 0.14, er * 0.14, 0, TAU);
          ctx.fill();
        }
      }
    }

    // mouth
    const my = R * 0.32;
    ctx.strokeStyle = '#4a3b5c';
    ctx.lineWidth = Math.max(2.5, R * 0.05);
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (this.sleeping) {
      ctx.arc(0, my - 4, R * 0.1, 0.1 * Math.PI, 0.9 * Math.PI);
    } else if (stretch > 1.6 || this.grabbed) {
      // "o" mouth when stretched
      ctx.fillStyle = '#4a3b5c';
      ctx.beginPath();
      ctx.ellipse(0, my, R * 0.1, R * 0.14, 0, 0, TAU);
      ctx.fill();
    } else if (this.pKey === 'hyper') {
      // big grin
      ctx.arc(0, my - R * 0.08, R * 0.22, 0.2 * Math.PI, 0.8 * Math.PI);
    } else {
      // smile
      ctx.arc(0, my - R * 0.04, R * 0.16, 0.25 * Math.PI, 0.75 * Math.PI);
    }
    ctx.stroke();

    // blush
    ctx.fillStyle = 'rgba(255,120,150,0.35)';
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(sx * R * 0.52, R * 0.18, R * 0.1, 0, TAU);
      ctx.fill();
    }
  }
}
Creature._c = {};

'use strict';
/* WOBBLE WORLD — 04-toys.js : chain-reaction toys for the dioramas.
   Every toy: update(dt, world, game) + draw(ctx, game).
   Toys talk to the game through game.bus events (see BUILD-LEDGER). */

/* ---------------- Trampoline ---------------- */
class Trampoline {
  constructor(x, y, w, power, color) {
    this.x = x; this.y = y; this.w = w;
    this.power = power || 1050;
    this.color = color || '#4ec9b8';
    this.sag = 0; this.sagV = 0;   // membrane spring
    this.cool = {};                // per-creature cooldown
  }
  update(dt, world, game) {
    // membrane spring physics
    const acc = -this.sag * 90 - this.sagV * 8;
    this.sagV += acc * dt;
    this.sag += this.sagV * dt;
    for (const k in this.cool) { this.cool[k] -= dt; if (this.cool[k] <= 0) delete this.cool[k]; }

    for (const b of world.blobs) {
      if (b.dead || b.ridingBubble) continue;
      const c = b.centroid(Trampoline._c);
      const hw = this.w / 2;
      if (Math.abs(c.x - this.x) > hw + b.restR * 0.4) continue;
      const bottom = c.y + b.restR * 0.8;
      if (bottom < this.y - 14 || bottom > this.y + 46) continue;
      const v = b.velocity(dt, Trampoline._v);
      const id = b.userData.cid || (b.userData.cid = Trampoline._cid++);
      if (v.y > 140 && !this.cool[id]) {
        // BOING!
        this.cool[id] = 0.35;
        this.sagV = 9;
        const boost = this.power * (0.75 + b.bounce * 0.5);
        for (let i = 0; i < b.n; i++) {
          const nd = b.nodes[i];
          nd.py = nd.y + boost * dt;
        }
        b.center.py = b.center.y + boost * dt;
        b.squash(0, 1, 0.35);
        game.audio.boing(Util.clamp(v.y / 1200, 0.2, 1));
        game.world.particles.ring(this.x, this.y, '#ffffff', this.w * 0.4);
        game.bus.emit('bounce', { creature: b, toy: this });
      } else if (v.y <= 140) {
        // gentle rest on the membrane
        const targetY = this.y - b.restR * 0.8;
        if (c.y > targetY) {
          const push = (c.y - targetY) * 0.4;
          for (let i = 0; i < b.n; i++) { b.nodes[i].y -= push; }
          b.center.y -= push;
          this.sag = Util.clamp(this.sag + b.restR * 0.002, 0, 1);
        }
      }
    }
  }
  draw(ctx, game) {
    const hw = this.w / 2;
    // legs
    ctx.strokeStyle = '#b08968';
    ctx.lineWidth = 10; ctx.lineCap = 'round';
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(this.x + sx * hw * 0.8, this.y + 8);
      ctx.lineTo(this.x + sx * hw * 0.95, this.y + 64);
      ctx.stroke();
    }
    // rim
    ctx.strokeStyle = '#8a5a44';
    ctx.lineWidth = 12;
    ctx.beginPath();
    ctx.ellipse(this.x, this.y, hw, 16, 0, 0, TAU);
    ctx.stroke();
    // membrane (sags with spring)
    const sagPx = this.sag * 26;
    ctx.beginPath();
    ctx.ellipse(this.x, this.y + sagPx * 0.4, hw - 8, 14 + sagPx * 0.3, 0, 0, TAU);
    const g = ctx.createLinearGradient(0, this.y - 14, 0, this.y + 30);
    g.addColorStop(0, Util.shade(this.color, 30));
    g.addColorStop(1, Util.shade(this.color, -12));
    ctx.fillStyle = g;
    ctx.globalAlpha = 0.95;
    ctx.fill();
    ctx.globalAlpha = 1;
    // coil springs (zigzag, compress with sag)
    ctx.strokeStyle = '#9aa5b1';
    ctx.lineWidth = 4;
    for (const sx of [-1, 1]) {
      const bx = this.x + sx * hw * 0.92;
      const top = this.y - 2 - sagPx * 0.5, bot = this.y + 44;
      ctx.beginPath();
      const segs = 5;
      for (let i = 0; i <= segs; i++) {
        const yy = top + (bot - top) * (i / segs);
        const xx = bx + (i % 2 === 0 ? -7 : 7);
        if (i === 0) ctx.moveTo(bx, yy); else ctx.lineTo(xx, yy);
      }
      ctx.stroke();
    }
  }
}
Trampoline._c = {};
Trampoline._v = {};
Trampoline._cid = 1;

/* ---------------- DominoTower ---------------- */
class DominoTower {
  constructor(game, x, baseY, count, bw, bh) {
    this.blocks = [];
    this.total = count;
    const colors = ['#ff8fb3', '#7fe3b2'];
    for (let i = 0; i < count; i++) {
      const bx = x + (i % 2 === 0 ? -4 : 4);
      const by = baseY - bh / 2 - i * (bh + 6);
      const blk = new JellyBlock(bx, by, bw, bh, colors[i % 2]);
      blk.userData.index = i;
      this.blocks.push(blk);
      game.world.blocks.push(blk);
    }
  }
  update(dt, world, game) {
    for (const blk of this.blocks) {
      if (!blk.downNotified && blk.isDown()) {
        blk.downNotified = true;
        game.bus.emit('domino-down', { index: blk.userData.index, total: this.total });
        const c = blk.centroid(DominoTower._c);
        game.world.particles.ring(c.x, c.y, '#ffffff', 40);
        game.audio.boing(0.3);
      }
    }
  }
  draw(ctx, game) {
    for (const blk of this.blocks) {
      const n = blk.nodes;
      ctx.beginPath();
      ctx.moveTo(n[0].x, n[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(n[i].x, n[i].y);
      ctx.closePath();
      const c = blk.centroid(DominoTower._c);
      const g = ctx.createLinearGradient(0, c.y - blk.h / 2, 0, c.y + blk.h / 2);
      g.addColorStop(0, Util.shade(blk.color, 32));
      g.addColorStop(1, Util.shade(blk.color, -10));
      ctx.globalAlpha = 0.94;
      ctx.fillStyle = g;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = Util.rgba(Util.shade(blk.color, -30), 0.5);
      ctx.lineWidth = 4;
      ctx.stroke();
      // gloss dot

/* ---------------- MagnetOrb ---------------- */
class MagnetOrb {
  constructor(x, y, r) {
    this.x = x; this.y = y; this.r = r || 34;
    this.pull = 2600; // px/s^2 at the orb surface
    this.sparkT = 0;
  }
  update(dt, world, game) {
    this.sparkT -= dt;
    if (this.sparkT <= 0) {
      this.sparkT = Util.rand(0.2, 0.6);
      const a = Util.rand(0, TAU);
      world.particles.spawn('sparkle', this.x + Math.cos(a) * this.r, this.y + Math.sin(a) * this.r,
        { life: 0.5, size: 7, color: '#aef3ff' });
    }
    for (const b of world.blobs) {
      if (!(b instanceof GooBall) || b.snapped) continue;
      const c = b.centroid(MagnetOrb._c);
      const dx = this.x - c.x, dy = this.y - c.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < 520 && d > 1) {
        // proper acceleration toward the orb (overcomes gravity up close)
        const A = this.pull * (1 - d / 520);
        b.applyImpulse(dx / d * A * dt * dt, dy / d * A * dt * dt);
        // damp swirling so captures settle instead of orbiting forever
        for (let i = 0; i < b.n; i++) {
          const nd = b.nodes[i];
          nd.px += (nd.x - nd.px) * 0.06;
          nd.py += (nd.y - nd.py) * 0.06;
        }
      }
      if (d < this.r + 20) {
        b.snapped = this;
        // stick to orb surface
        const a = Math.atan2(c.y - this.y, c.x - this.x);
        const tx = this.x + Math.cos(a) * (this.r + 14);
        const ty = this.y + Math.sin(a) * (this.r + 14);
        for (let i = 0; i < b.n; i++) {
          const nd = b.nodes[i];
          const ox = nd.x - c.x, oy = nd.y - c.y;
          nd.x = tx + ox * 0.9; nd.y = ty + oy * 0.9;
          nd.px = nd.x; nd.py = nd.y;
        }
        b.center.x = tx; b.center.y = ty;
        b.center.px = tx; b.center.py = ty;
        game.audio.snap();
        for (let i = 0; i < 6; i++) {
          world.particles.spawn('sparkle', tx, ty, { life: 0.6, size: Util.rand(5, 9), color: '#aef3ff', vx: Util.rand(-120, 120), vy: Util.rand(-120, 120) });
        }
        game.bus.emit('snap', { ball: b, orb: this });
      }
    }
  }
  draw(ctx, game) {
    const t = game.time;
    // glow
    const g = ctx.createRadialGradient(this.x, this.y, 4, this.x, this.y, this.r * 2.6);
    g.addColorStop(0, 'rgba(120,230,255,0.5)');
    g.addColorStop(1, 'rgba(120,230,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 2.6, 0, TAU); ctx.fill();
    // orbit rings
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 12]);
    ctx.lineDashOffset = -t * 40;
    ctx.beginPath(); ctx.ellipse(this.x, this.y, this.r + 22, this.r + 10, 0.4, 0, TAU); ctx.stroke();
    ctx.lineDashOffset = t * 30;
    ctx.beginPath(); ctx.ellipse(this.x, this.y, this.r + 36, this.r + 20, -0.3, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    // orb body
    const bg = ctx.createRadialGradient(this.x - 10, this.y - 12, 4, this.x, this.y, this.r);
    bg.addColorStop(0, '#e8fbff');
    bg.addColorStop(0.55, '#6fdcf5');
    bg.addColorStop(1, '#2fa8cc');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, TAU); ctx.fill();
    // poles
    ctx.fillStyle = '#ff7b8a';
    ctx.beginPath(); ctx.arc(this.x, this.y - this.r * 0.45, 7, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('N', this.x, this.y - this.r * 0.45);
    ctx.fillStyle = '#6f8cff';
    ctx.beginPath(); ctx.arc(this.x, this.y + this.r * 0.45, 7, 0, TAU); ctx.fill();

/* ---------------- Seesaw ---------------- */
class Seesaw {
  constructor(game, x, y, len) {
    this.x = x; this.y = y; this.len = len;
    this.angle = 0; this.angVel = 0;
    this.launchCool = 0;
    // live static segment so blobs really ride the plank
    this.seg = game.world.addStatic(x - len / 2, y, x + len / 2, y,
      { bounce: 0.35, friction: 0.06, tag: 'seesaw' });
  }
  update(dt, world, game) {
    this.launchCool -= dt;
    // weight distribution -> target angle
    let torque = 0;
    for (const b of world.blobs) {
      if (b.dead || b.ridingBubble || !(b instanceof Creature)) continue;
      const c = b.centroid(Seesaw._c);
      const dx = c.x - this.x;
      if (Math.abs(dx) < this.len / 2 && Math.abs(c.y - this.y) < 120) {
        torque += Math.sign(dx) * b.restR;
      }
    }
    const target = Util.clamp(torque * 0.004, -0.3, 0.3);
    const acc = (target - this.angle) * 26 - this.angVel * 5.5;
    const prevVel = this.angVel;
    this.angVel += acc * dt;
    this.angle += this.angVel * dt;
    // update the live segment
    const ca = Math.cos(this.angle), sa = Math.sin(this.angle);
    this.seg.x1 = this.x - ca * this.len / 2; this.seg.y1 = this.y - sa * this.len / 2;
    this.seg.x2 = this.x + ca * this.len / 2; this.seg.y2 = this.y + sa * this.len / 2;
    // launch: plank whips up fast under a rider
    if (Math.abs(this.angVel) > 2.6 && this.launchCool <= 0 && Math.abs(prevVel) < Math.abs(this.angVel)) {
      for (const b of world.blobs) {
        if (b.dead || b.ridingBubble || !(b instanceof Creature)) continue;
        const c = b.centroid(Seesaw._c);
        const risingSide = this.angVel > 0 ? 1 : -1; // which end moves up
        const dx = c.x - this.x;
        if (Math.sign(dx) === risingSide && Math.abs(dx) > this.len * 0.18 && Math.abs(dx) < this.len / 2 + 40 && Math.abs(c.y - this.y) < 130) {
          this.launchCool = 1.2;
          b.applyImpulse(risingSide * 160 * 0.016, -980 * 0.016);
          b.squash(0, 1, 0.3);
          game.audio.boing(0.9);
          world.particles.ring(c.x, c.y, '#ffffff', 50);
          game.bus.emit('launch', { creature: b, toy: 'seesaw' });
          break;
        }
      }
    }
  }
  draw(ctx, game) {
    // fulcrum: jelly dome
    const fg = ctx.createLinearGradient(0, this.y, 0, this.y + 70);
    fg.addColorStop(0, '#ffb3c6'); fg.addColorStop(1, '#e87f9c');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.arc(this.x, this.y + 8, 44, Math.PI, 0);
    ctx.closePath(); ctx.fill();
    // plank: candy stripes, rotated
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    const hw = this.len / 2;
    for (let i = -4; i < 4; i++) {
      ctx.fillStyle = i % 2 === 0 ? '#ffd166' : '#ff8fa3';
      ctx.fillRect(i * hw / 4, -13, hw / 4, 26);
    }
    ctx.strokeStyle = '#a34d68';
    ctx.lineWidth = 5;
    Util.rr(ctx, -hw, -13, this.len, 26, 13);
    ctx.stroke();
    // end bumpers
    for (const sx of [-1, 1]) {
      ctx.fillStyle = '#ff5d6c';
      ctx.beginPath(); ctx.arc(sx * (hw - 8), 0, 12, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.arc(sx * (hw - 8) - 3, -4, 4, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

      const c = b.centroid(GooPool._c);

      const id = b.userData.cid || (b.userData.cid = GooPool._cid++);
      const key = this.name + ':' + id;
      const v = b.velocity(dt, GooPool._v);
      const speed = Math.sqrt(v.x * v.x + v.y * v.y);
      if (inside) {
        // viscous drag + buoyancy
        for (let i = 0; i < b.n; i++) {
          const nd = b.nodes[i];
          nd.px += (nd.x - nd.px) * 0.12;
          nd.py += (nd.y - nd.py) * 0.12 - 26 * dt * dt * 60;

          }

    ctx.fill();
    // goo body: layered ellipses
    ctx.fillStyle = Util.shade(this.color, -22);
    Util.ell(ctx, this.x, this.y + 4, hw, 30);

    const g = ctx.createLinearGradient(0, this.y - 26, 0, this.y + 12);
    g.addColorStop(0, Util.shade(this.color, 26));
    g.addColorStop(1, this.color);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(this.x, this.y - 6, hw, 26, 0, 0, TAU);
    ctx.fill();
    // animated surface wave
    ctx.strokeStyle = 'rgba(255,255,255,0.65)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    for (let i = -hw + 8; i <= hw - 8; i += 12) {
      const yy = this.y - 12 + Math.sin(t * 3 + i * 0.05) * 4;
      if (i === -hw + 8) ctx.moveTo(this.x + i, yy); else ctx.lineTo(this.x + i, yy);

    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.ellipse(this.x - hw * 0.35, this.y - 16, hw * 0.3, 7, -0.15, 0, TAU);
    ctx.fill();
    // drips at edges
    ctx.fillStyle = this.color;
    for (let i = 0; i < 3; i++) {
      const dx = -hw + 20 + i * (hw * 2 - 40) / 2;
      const dripLen = 6 + Math.sin(t * 2 + i * 2.1) * 4;
      ctx.beginPath();
      ctx.arc(this.x + dx, this.y + 24 + dripLen, 6, 0, TAU);
      ctx.fill();
    }
  }

/* ---------------- BubblePipe + Bubble ---------------- */
class Bubble {
  constructor(x, y, r) {
    this.x = x; this.y = y; this.r = r;
    this.vy = -Util.rand(50, 90);
    this.phase = Util.rand(0, TAU);
    this.dead = false;
    this.carrying = null;
    this.startY = y;
    this.born = 0;
  }
  pop(game, silent) {
    if (this.dead) return;
    this.dead = true;
    if (this.carrying) {
      const cr = this.carrying;
      cr.ridingBubble = null;
      cr.applyImpulse(Util.rand(-60, 60) * 0.016, -260 * 0.016);
      this.carrying = null;
      const rode = this.startY - this.y;
      if (rode >= 240) game.bus.emit('ride', { creature: cr, height: rode });
    }
    if (!silent) {
      game.audio.pop();
      game.world.particles.ring(this.x, this.y, '#ffffff', this.r);
      for (let i = 0; i < 5; i++) {
        game.world.particles.spawn('sparkle', this.x + Util.rand(-14, 14), this.y + Util.rand(-14, 14),
          { life: 0.5, size: 6, color: '#cfeeff' });
      }
      game.bus.emit('pop', { x: this.x, y: this.y });
    }
  }
  update(dt, world, game) {
    this.born += dt;
    this.phase += dt * 3;
    this.x += Math.sin(this.phase) * 26 * dt;
    this.y += this.vy * dt;
    // catch a creature
    if (!this.carrying) {
      for (const b of world.blobs) {
        if (b.dead || b.grabbed || b.ridingBubble || !(b instanceof Creature)) continue;
        const c = b.centroid(Bubble._c);
        if (Util.dist(c.x, c.y, this.x, this.y) < this.r + b.restR * 0.5 && b.restR < this.r * 1.5) {
          this.carrying = b;
          b.ridingBubble = this;
          this.startY = this.y;
          game.audio.squelch();
          break;
        }
      }
    }
    if (this.y < 130 || this.born > 14) this.pop(game);
  }
  draw(ctx, game) {
    const wob = Math.sin(this.phase * 1.3) * 0.05;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(1 + wob, 1 - wob);
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, this.r, 0, TAU); ctx.stroke();
    // rainbow arc
    ctx.lineWidth = 4;
    const cols = ['#ff9eb0', '#ffd166', '#8fe388', '#7cc7ff'];
    for (let i = 0; i < cols.length; i++) {
      ctx.strokeStyle = cols[i] + '';
      ctx.globalAlpha = 0.55;
      ctx.beginPath();
      ctx.arc(0, 0, this.r - 4, Math.PI * (1.05 + i * 0.09), Math.PI * (1.45 + i * 0.09));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.ellipse(-this.r * 0.35, -this.r * 0.4, this.r * 0.18, this.r * 0.1, -0.5, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

class BubblePipe {
  constructor(x, y) {

      this.timer = Util.rand(1.6, 3.0);
      this.bubbles.push(new Bubble(this.x + Util.rand(-8, 8), this.y - 30, Util.rand(34, 52)));

/* ---------------- SpringFlower (launch pad) ---------------- */
class SpringFlower {
  constructor(x, y, power) {
    this.x = x; this.y = y;
    this.power = power || 1250;
    this.dip = 0; this.dipV = 0;
    this.cool = {};

  }
  update(dt, world, game) {
    const acc = -this.dip * 120 - this.dipV * 9;
    this.dipV += acc * dt;
    this.dip += this.dipV * dt;
    for (const k in this.cool) { this.cool[k] -= dt; if (this.cool[k] <= 0) delete this.cool[k]; }
    for (const b of world.blobs) {
      if (b.dead || b.ridingBubble || !(b instanceof Creature)) continue;
      const c = b.centroid(SpringFlower._c);
      if (Math.abs(c.x - this.x) > 70) continue;
      const bottom = c.y + b.restR * 0.8;
      if (bottom < this.y - 30 || bottom > this.y + 30) continue;
      const v = b.velocity(dt, SpringFlower._v);
      const id = b.userData.cid || (b.userData.cid = SpringFlower._cid++);
      if (v.y > 120 && !this.cool[id]) {
        this.cool[id] = 0.8;
        this.dipV = -7; // anticipation dip, then launch
        const launch = () => {
          const boost = this.power * (0.8 + b.bounce * 0.4);
          for (let i = 0; i < b.n; i++) b.nodes[i].py = b.nodes[i].y + boost * dt;
          b.center.py = b.center.y + boost * dt;
          b.squash(0, -1, 0.4);
          game.audio.boing(1);
          game.world.particles.ring(this.x, this.y - 20, '#ffffff', 60);
          for (let i = 0; i < 8; i++) {
            game.world.particles.spawn('star', this.x + Util.rand(-20, 20), this.y - 30,
              { life: 0.6, size: Util.rand(5, 9), color: this.petalHue, vx: Util.rand(-120, 120), vy: Util.rand(-200, -60), grav: 400, rot: Util.rand(0, 6), vr: 5 });
          }
          game.bus.emit('launch', { creature: b, toy: 'flower' });
        };
        // tiny anticipation delay via dip timer
        this._pending = { t: 0.12, fn: launch };

    if (this._pending) {

      if (this._pending.t <= 0) { const f = this._pending.fn; this._pending = null; f(); }

      ctx.beginPath(); ctx.ellipse(0, 0, 22, 10, 0, 0, TAU); ctx.fill();
      ctx.restore();

      ctx.beginPath();
      ctx.ellipse(this.x + Math.cos(a) * 30, py + Math.sin(a) * 30, 20, 13, a, 0, TAU);

/* ---------------- Pillow ---------------- */
class Pillow {
  constructor(game, x, y, w, h, rot, color, index) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.rot = rot || 0;
    this.color = color || '#ffe3ef';
    this.index = index || 0;
    this.squashT = 0;
    this.cool = 0;
    this.breathe = Util.rand(0, TAU);
    // top surface as a static segment (rotated)
    const ca = Math.cos(rot), sa = Math.sin(rot);
    const hw = w / 2;
    game.world.addStatic(
      x - ca * hw, y - sa * hw - h * 0.35,
      x + ca * hw, y + sa * hw - h * 0.35,
      { bounce: 0.22, friction: 0.12, tag: 'pillow' });
  }
  update(dt, world, game) {
    this.breathe += dt;
    if (this.squashT > 0) this.squashT = Math.max(0, this.squashT - dt * 3);
    this.cool -= dt;
    if (this.cool > 0) return;
    for (const b of world.blobs) {
      if (b.dead || b.ridingBubble || !(b instanceof Creature)) continue;
      const c = b.centroid(Pillow._c);
      const v = b.velocity(dt, Pillow._v);
      const local = {
        x: (c.x - this.x) * Math.cos(-this.rot) - (c.y - this.y) * Math.sin(-this.rot),
        y: (c.x - this.x) * Math.sin(-this.rot) + (c.y - this.y) * Math.cos(-this.rot)
      };
      if (Math.abs(local.x) < this.w / 2 && local.y > -this.h && local.y < 20 && v.y > 160) {
        this.cool = 0.6;
        this.squashT = 1;
        game.audio.splat(false);
        world.particles.spawn('poof', c.x, this.y - this.h / 2, { life: 0.5, size: 24, color: '#ffffff' });
        game.bus.emit('pillow', { creature: b, pillowIndex: this.index });
        break;
      }
    }
  }
  draw(ctx, game) {
    const br = 1 + Math.sin(this.breathe * 2.4) * 0.012; // cozy breathing
    const sq = 1 - this.squashT * 0.22;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.scale(br, br * sq);
    // shadow
    ctx.fillStyle = 'rgba(74,59,92,0.14)';
    Util.ell(ctx, 0, this.h / 2 + 12, this.w / 2, 12);
    ctx.fill();
    // body
    const g = ctx.createLinearGradient(0, -this.h / 2, 0, this.h / 2);
    g.addColorStop(0, Util.shade(this.color, 18));
    g.addColorStop(1, Util.shade(this.color, -8));
    ctx.fillStyle = g;
    Util.rr(ctx, -this.w / 2, -this.h / 2, this.w, this.h, 34);
    ctx.fill();
    ctx.strokeStyle = Util.rgba(Util.shade(this.color, -24), 0.6);
    ctx.lineWidth = 4;
    Util.rr(ctx, -this.w / 2, -this.h / 2, this.w, this.h, 34);
    ctx.stroke();
    // seam
    ctx.strokeStyle = Util.rgba(Util.shade(this.color, -18), 0.8);
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 8]);
    Util.rr(ctx, -this.w / 2 + 14, -this.h / 2 + 14, this.w - 28, this.h - 28, 24);
    ctx.stroke();
    ctx.setLineDash([]);
    // button dimples
    ctx.fillStyle = Util.rgba(Util.shade(this.color, -20), 0.7);
    for (const bx of [-this.w / 5, this.w / 5]) {
      ctx.beginPath(); ctx.arc(bx, 0, 7, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.arc(bx - 2, -2, 2.5, 0, TAU); ctx.fill();
      ctx.fillStyle = Util.rgba(Util.shade(this.color, -20), 0.7);
    }
    ctx.restore();
  }
}

/* ---------------- GooJar (paint station) ---------------- */
class GooJar {
  constructor(x, y, goo) {
    this.x = x; this.y = y;
    this.goo = goo; // {hex, name, ...}
    this.bob = Util.rand(0, TAU);
  }
  update(dt, world, game) { this.bob += dt * 2; }
  tap(game) {
    if (game.selectedGoo === this.goo) {
      game.selectedGoo = null;
    } else {
      game.selectedGoo = this.goo;
      game.audio.uiClick();
      game.toast('Tap a friend to paint it ' + this.goo.name + '!');
    }
    game.bus.emit('jar-select', { goo: this.goo });
    return true;
  }
  draw(ctx, game) {
    const selected = game.selectedGoo === this.goo;
    const bobY = Math.sin(this.bob) * 4;
    const y = this.y + bobY;
    if (selected) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 5;
      ctx.setLineDash([12, 10]);
      ctx.lineDashOffset = -game.time * 50;
      ctx.beginPath(); ctx.arc(this.x, y - 10, 52, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
    // shadow
    ctx.fillStyle = 'rgba(74,59,92,0.12)';
    Util.ell(ctx, this.x, this.y + 52, 40, 10);
    ctx.fill();
    // jar glass
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    Util.rr(ctx, this.x - 34, y - 44, 68, 88, 16);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 4;
    Util.rr(ctx, this.x - 34, y - 44, 68, 88, 16);
    ctx.stroke();
    // goo fill with meniscus
    ctx.fillStyle = this.goo.hex;
    ctx.beginPath();
    ctx.moveTo(this.x - 28, y + 38);
    ctx.lineTo(this.x - 28, y - 8);
    ctx.quadraticCurveTo(this.x, y - 18 + Math.sin(game.time * 3) * 3, this.x + 28, y - 8);
    ctx.lineTo(this.x + 28, y + 38);
    ctx.quadraticCurveTo(this.x, y + 46, this.x - 28, y + 38);
    ctx.closePath();
    ctx.fill();
    // glass shine
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(this.x - 26, y - 36, 10, 66);
    // lid
    ctx.fillStyle = '#b08968';
    Util.rr(ctx, this.x - 38, y - 60, 76, 20, 8);
    ctx.fill();
    // label
    ctx.fillStyle = '#ffffff';
    Util.rr(ctx, this.x - 26, y + 2, 52, 24, 10);
    ctx.fill();
    ctx.fillStyle = '#4a3b5c';
    ctx.font = 'bold 13px "Baloo 2", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(this.goo.name, this.x, y + 14);
  }
}

'use strict';
/* WOBBLE WORLD — 06-mixer.js : Creature Mixer.
   Pick 2 parent creatures + up to 3 goo colors + a name = your own wobble
   friend. Snapshot saves a PNG of your creation.
   Layout is computed once in layout() and shared by draw() + handleTap(). */

class Mixer {
  constructor(game) {
    this.game = game;
    this.parents = [];   // Creature refs (max 2)
    this.goos = [];      // goo defs (max 3)
    this.name = 'Wobbles';
    this.openT = 0;
    this.mixFlash = 0;
  }

  open() {
    this.parents = [];
    this.goos = [];
    this.openT = 0;
    this.game.overlay = 'mixer';
    this.game.audio.uiClick();
  }

  close() {
    this.game.overlay = null;
    this.game.ui.hideOverlay();
    this.game.audio.uiClick();
  }

  panel() { return { x: 70, y: 130, w: 660, h: 940 }; }

  // single source of truth for every Y coordinate below
  layout() {
    const P = this.panel();
    const creatures = this.game.creatures.slice(0, 8);
    const perRow = 4, cw = 140, ch = 150, gap = 14;
    const rows = Math.max(1, Math.ceil(creatures.length / perRow));
    const cards = [];
    for (let i = 0; i < creatures.length; i++) {
      const row = Math.floor(i / perRow), col = i % perRow;
      cards.push({
        creature: creatures[i],
        rect: {
          x: P.x + 44 + col * (cw + gap),
          y: P.y + 196 + row * (ch + gap),
          w: cw, h: ch
        }
      });
    }
    const cardsBottom = P.y + 196 + rows * (ch + gap);
    const gooLabelY = cardsBottom + 30;
    const gooY = gooLabelY + 58;
    const nameLabelY = gooY + 100;
    const nameY = nameLabelY + 28;
    const mixY = nameY + 96;
    const snapY = mixY + 98;
    return { P, cards, gooLabelY, gooY, nameLabelY, nameY, mixY, snapY };
  }

  handleTap(x, y) {
    const g = this.game;
    const L = this.layout(), P = L.P;
    // close button
    if (Util.dist(x, y, P.x + P.w - 46, P.y + 46) < 44) { this.close(); return true; }
    // creature cards
    for (const { creature: cr, rect: r } of L.cards) {
      if (x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h) {
        const idx = this.parents.indexOf(cr);
        if (idx >= 0) this.parents.splice(idx, 1);
        else if (this.parents.length < 2) this.parents.push(cr);
        else { this.parents.shift(); this.parents.push(cr); }
        g.audio.uiClick();
        return true;
      }
    }
    // goo swatches
    for (let i = 0; i < GOO_COLORS.length; i++) {
      const sx = P.x + 150 + i * 180, sy = L.gooY;
      if (Util.dist(x, y, sx, sy) < 56) {
        const goo = GOO_COLORS[i];
        const idx = this.goos.indexOf(goo);
        if (idx >= 0) this.goos.splice(idx, 1);
        else if (this.goos.length < 3) this.goos.push(goo);
        g.audio.uiClick();
        return true;
      }
    }
    // name box
    if (x > P.x + 180 && x < P.x + 480 && y > L.nameY && y < L.nameY + 68) {
      g.ui.showNameInput(this.name, (val) => {
        if (val && val.trim()) this.name = val.trim().slice(0, 18);
      });
      return true;
    }
    // MIX button
    if (x > P.x + 190 && x < P.x + 470 && y > L.mixY && y < L.mixY + 86) {
      this.mix();
      return true;
    }
    // snapshot button
    if (x > P.x + 190 && x < P.x + 470 && y > L.snapY && y < L.snapY + 58) {
      g.snapshot();
      return true;
    }
    return true; // swallow all taps while open
  }

  mix() {
    const g = this.game;
    if (this.parents.length < 2) {
      g.toast('Pick TWO parents first!');
      g.audio.uiClick();
      return;
    }
    const [a, b] = this.parents;
    const ac = a.centroid(Mixer._c), bc = b.centroid(Mixer._c);
    const sx = Util.clamp((ac.x + bc.x) / 2, 140, STAGE_W - 140);
    const sy = Math.min(ac.y, bc.y) - 130;
    let color = Util.mixHex(a.color, b.color, 0.5);
    let bounce = (a.bounce + b.bounce) / 2;
    let energy = (a.energy + b.energy) / 2;
    let stick = (a.stickiness + b.stickiness) / 2;
    for (const goo of this.goos) {
      color = Util.mixHex(color, goo.hex, 0.35);
      bounce = Util.clamp(bounce + goo.bounceUp * 0.5, 0.15, 0.95);
      energy = Util.clamp(energy + goo.energyUp * 0.5, 0.1, 1.2);
      stick = Util.clamp(stick + goo.stickyUp * 0.5, 0, 1);
    }
    const child = new Creature(a.pKey, sx, Math.max(220, sy), {
      color, bounce, energy,
      stickiness: stick,
      r: (a.restR + b.restR) / 2,
      nodes: Math.round((a.n + b.n) / 2),
      name: this.name
    });
    child.userData.cid = g.nextCid++;
    child.labelT = 6;
    g.world.blobs.push(child);
    g.creatures.push(child);
    child.squash(0, -1, 0.4);
    for (let i = 0; i < 26; i++) {
      g.world.particles.spawn('sparkle', sx + Util.rand(-60, 60), sy + Util.rand(-60, 60),
        { life: Util.rand(0.5, 1), size: Util.rand(5, 10), color: Util.pick(['#ffffff', '#ffd166', '#ff9ebb', color]), vx: Util.rand(-140, 140), vy: Util.rand(-200, -40), grav: 300 });
    }
    g.world.particles.ring(sx, sy, '#ffffff', 90);
    g.audio.giggle();
    setTimeout(() => { try { g.audio.sparkle(); } catch (e) {} }, 350);
    g.save.creations.push({ name: this.name, color, at: Date.now() });
    g.persist();
    g.lastCreationName = this.name;
    g.toast('Meet ' + this.name + '!');
    this.mixFlash = 1;
    this.parents = [];
    this.goos = [];
    this.close();
  }

  update(dt) {
    this.openT = Math.min(1, this.openT + dt * 3);
    if (this.mixFlash > 0) this.mixFlash -= dt * 2;
  }

  draw(ctx) {
    const g = this.game;
    const L = this.layout(), P = L.P;
    const t = Util.easeOutBack(this.openT);
    ctx.fillStyle = 'rgba(40,28,58,0.55)';
    ctx.fillRect(0, 0, STAGE_W, STAGE_H);
    ctx.save();
    ctx.translate(P.x + P.w / 2, P.y + P.h / 2);
    ctx.scale(t, t);
    ctx.translate(-(P.x + P.w / 2), -(P.y + P.h / 2));
    // panel
    ctx.fillStyle = 'rgba(255,247,251,0.98)';
    Util.rr(ctx, P.x, P.y, P.w, P.h, 30);
    ctx.fill();
    ctx.strokeStyle = '#ffd6e8';
    ctx.lineWidth = 5;
    Util.rr(ctx, P.x, P.y, P.w, P.h, 30);
    ctx.stroke();
    // close X
    ctx.fillStyle = '#ff6f9f';
    ctx.beginPath(); ctx.arc(P.x + P.w - 46, P.y + 46, 30, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(P.x + P.w - 58, P.y + 34); ctx.lineTo(P.x + P.w - 34, P.y + 58);
    ctx.moveTo(P.x + P.w - 34, P.y + 34); ctx.lineTo(P.x + P.w - 58, P.y + 58);
    ctx.stroke();

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#4a3b5c';
    ctx.font = 'bold 40px "Baloo 2", sans-serif';
    ctx.fillText('Creature Mixer', P.x + P.w / 2, P.y + 52);
    ctx.font = '20px "Baloo 2", sans-serif';
    ctx.fillStyle = '#7a6a8f';
    ctx.fillText('Mix two friends + goo = a brand-new friend!', P.x + P.w / 2, P.y + 96);

    // step 1: parents
    ctx.textAlign = 'left';
    ctx.font = 'bold 26px "Baloo 2", sans-serif';
    ctx.fillStyle = '#4a3b5c';
    ctx.fillText('1. Pick two parents:', P.x + 44, P.y + 160);
    for (const { creature: cr, rect: r } of L.cards) {
      const sel = this.parents.indexOf(cr) >= 0;
      ctx.fillStyle = sel ? '#ffe3ef' : '#ffffff';
      Util.rr(ctx, r.x, r.y, r.w, r.h, 18);

      ctx.stroke();

'use strict';
/* WOBBLE WORLD — 07-ui.js : screens, HUD, journal, tutorial hints, toasts,
   DOM overlay (name input + snapshot card). All game UI text is in English. */

class UIButton {
  constructor(x, y, w, h, label, onTap, opts) {
    opts = opts || {};
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.label = label;
    this.onTap = onTap;
    this.fontSize = opts.fontSize || 30;
    this.fill = opts.fill || ['#ff9ebb', '#ff6f9f'];
    this.textColor = opts.textColor || '#ffffff';
    this.circle = !!opts.circle;
    this.icon = opts.icon || null; // fn(ctx, cx, cy, s)
    this.pressT = 0;
    this.visible = true;
  }
  hit(x, y) {
    if (!this.visible) return false;
    if (this.circle) return Util.dist(x, y, this.x, this.y) < this.w / 2 + 8;
    return x > this.x - this.w / 2 && x < this.x + this.w / 2 &&
           y > this.y - this.h / 2 && y < this.y + this.h / 2;
  }
  press() { this.pressT = 1; }
  update(dt) { if (this.pressT > 0) this.pressT = Math.max(0, this.pressT - dt * 5); }
  draw(ctx, game) {
    if (!this.visible) return;
    const sq = 1 - this.pressT * 0.1;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(sq, sq);
    if (this.circle) {
      const r = this.w / 2;
      const g = ctx.createLinearGradient(0, -r, 0, r);
      g.addColorStop(0, this.fill[0]); g.addColorStop(1, this.fill[1]);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.ellipse(-r * 0.3, -r * 0.4, r * 0.4, r * 0.22, -0.4, 0, TAU); ctx.fill();
      if (this.icon) this.icon(ctx, 0, 0, r * 0.9);
      else {
        ctx.fillStyle = this.textColor;
        ctx.font = 'bold ' + this.fontSize + 'px "Baloo 2", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(this.label, 0, 2);
      }
    } else {
      const g = ctx.createLinearGradient(0, -this.h / 2, 0, this.h / 2);
      g.addColorStop(0, this.fill[0]); g.addColorStop(1, this.fill[1]);
      // soft drop shadow
      ctx.fillStyle = 'rgba(74,59,92,0.18)';
      Util.rr(ctx, -this.w / 2 + 3, -this.h / 2 + 7, this.w, this.h, this.h / 2.6);
      ctx.fill();
      ctx.fillStyle = g;
      Util.rr(ctx, -this.w / 2, -this.h / 2, this.w, this.h, this.h / 2.6);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      Util.rr(ctx, -this.w / 2 + 8, -this.h / 2 + 6, this.w - 16, this.h * 0.36, this.h / 4);
      ctx.fill();
      if (this.icon) this.icon(ctx, -this.w / 2 + 44, 0, 30);
      ctx.fillStyle = this.textColor;
      ctx.font = 'bold ' + this.fontSize + 'px "Baloo 2", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(this.label, this.icon ? 18 : 0, 2);
    }
    ctx.restore();
  }
}

/* ---------- giggle journal icons (tiny canvas glyphs) ---------- */
function drawGiggleIcon(ctx, icon, x, y, s, found) {
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = found ? 1 : 0.35;
  const main = found ? '#ff6f9f' : '#8d84a0';
  const soft = found ? '#ffd6e8' : '#cfc8dc';
  ctx.lineWidth = Math.max(2, s * 0.09);
  ctx.strokeStyle = main;
  ctx.fillStyle = main;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const u = s / 2;
  switch (icon) {
    case 'tower':
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = i % 2 ? '#7fe3b2' : '#ff8fb3';
        if (!found) ctx.fillStyle = '#b9b2c9';
        Util.rr(ctx, -u * 0.7, u * 0.7 - (i + 1) * u * 0.5, u * 1.4, u * 0.44, 4);
        ctx.fill();
      }
      break;
    case 'droplet':
      ctx.fillStyle = found ? '#4ec9ff' : '#b9b2c9';
      ctx.beginPath();
      ctx.moveTo(0, -u);
      ctx.bezierCurveTo(u * 0.8, -u * 0.1, u * 0.6, u * 0.7, 0, u * 0.7);
      ctx.bezierCurveTo(-u * 0.6, u * 0.7, -u * 0.8, -u * 0.1, 0, -u);
      ctx.fill();
      break;
    case 'stretch':
      ctx.beginPath(); ctx.moveTo(-u, 0); ctx.lineTo(u, 0); ctx.stroke();
      for (const sx of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(sx * u, 0); ctx.lineTo(sx * u * 0.6, -u * 0.35); ctx.lineTo(sx * u * 0.6, u * 0.35);
        ctx.closePath(); ctx.fill();
      }
      break;
    case 'bounce':
      ctx.beginPath(); ctx.arc(0, u * 0.3, u * 0.55, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -u * 0.45, u * 0.3, 0, TAU);
      ctx.fillStyle = soft; ctx.fill(); ctx.stroke();
      break;
    case 'sky':
      ctx.beginPath(); ctx.moveTo(0, u); ctx.lineTo(0, -u * 0.7); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -u); ctx.lineTo(-u * 0.45, -u * 0.4); ctx.lineTo(u * 0.45, -u * 0.4);
      ctx.closePath(); ctx.fill();
      break;
    case 'chain':
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath(); ctx.arc(i * u * 0.7, 0, u * 0.4, 0, TAU);
        ctx.fillStyle = soft; ctx.fill(); ctx.stroke();
      }
      break;
    case 'magnet':
      ctx.lineWidth = u * 0.5;
      ctx.beginPath(); ctx.arc(0, -u * 0.1, u * 0.55, 0, Math.PI); ctx.stroke();
      ctx.fillStyle = found ? '#ff7b8a' : '#b9b2c9';
      ctx.fillRect(-u * 0.8, -u * 0.1, u * 0.5, u * 0.4);
      ctx.fillStyle = found ? '#6f8cff' : '#b9b2c9';
      ctx.fillRect(u * 0.3, -u * 0.1, u * 0.5, u * 0.4);
      break;
    case 'pop':
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * TAU;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * u * 0.3, Math.sin(a) * u * 0.3);
        ctx.lineTo(Math.cos(a) * u, Math.sin(a) * u);
        ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(0, 0, u * 0.22, 0, TAU); ctx.fill();
      break;
    case 'sticky':
      ctx.fillStyle = found ? '#7fe3b2' : '#b9b2c9';
      ctx.beginPath(); ctx.arc(0, -u * 0.2, u * 0.6, 0, TAU); ctx.fill();
      ctx.fillRect(-u * 0.14, u * 0.2, u * 0.28, u * 0.7);
      ctx.beginPath(); ctx.arc(0, u * 0.9, u * 0.14, 0, TAU); ctx.fill();
      break;
    case 'ride':
      ctx.beginPath(); ctx.arc(0, -u * 0.25, u * 0.7, 0, TAU); ctx.stroke();
      ctx.fillStyle = soft;
      ctx.beginPath(); ctx.arc(0, u * 0.45, u * 0.32, 0, TAU); ctx.fill();
      break;
    case 'splash':
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(-u, i * u * 0.5);
        ctx.quadraticCurveTo(-u * 0.5, i * u * 0.5 - u * 0.4, 0, i * u * 0.5);
        ctx.quadraticCurveTo(u * 0.5, i * u * 0.5 + u * 0.4, u, i * u * 0.5);
        ctx.stroke();
      }
      break;
    case 'paint':
      ctx.fillStyle = '#ff8fb3';
      ctx.beginPath(); ctx.arc(-u * 0.25, 0, u * 0.45, 0, TAU); ctx.fill();
      ctx.fillStyle = '#4ec9ff';
      ctx.beginPath(); ctx.arc(u * 0.3, -u * 0.1, u * 0.4, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffd94e';
      ctx.beginPath(); ctx.arc(u * 0.05, u * 0.4, u * 0.32, 0, TAU); ctx.fill();
      break;
    case 'seesaw':
      ctx.save(); ctx.rotate(-0.35);
      ctx.fillStyle = found ? '#ffd166' : '#b9b2c9';
      ctx.fillRect(-u, -u * 0.16, u * 2, u * 0.32);
      ctx.restore();
      ctx.fillStyle = main;
      ctx.beginPath();
      ctx.moveTo(-u * 0.4, u); ctx.lineTo(u * 0.4, u); ctx.lineTo(0, u * 0.25);
      ctx.closePath(); ctx.fill();
      break;
    case 'flower':
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * TAU - Math.PI / 2;
        ctx.fillStyle = found ? '#ff9ebb' : '#b9b2c9';
        ctx.beginPath();
        ctx.ellipse(Math.cos(a) * u * 0.5, Math.sin(a) * u * 0.5, u * 0.34, u * 0.24, a, 0, TAU);
        ctx.fill();
      }
      ctx.fillStyle = '#ffd166';
      ctx.beginPath(); ctx.arc(0, 0, u * 0.28, 0, TAU); ctx.fill();
      break;
    case 'wake':
      ctx.fillStyle = '#ffd166';
      ctx.beginPath(); ctx.arc(0, 0, u * 0.45, 0, TAU); ctx.fill();
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * TAU;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * u * 0.6, Math.sin(a) * u * 0.6);
        ctx.lineTo(Math.cos(a) * u * 0.9, Math.sin(a) * u * 0.9);
        ctx.stroke();
      }
      break;
    case 'pillow':
      ctx.fillStyle = soft;
      Util.rr(ctx, -u, -u * 0.6, u * 2, u * 1.2, u * 0.4);
      ctx.fill();
      ctx.stroke();
      break;
    case 'nap':
      ctx.fillStyle = main;
      ctx.font = 'bold ' + Math.round(u * 1.6) + 'px "Baloo 2", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Z', u * 0.3, -u * 0.3);
      ctx.font = 'bold ' + Math.round(u * 1.1) + 'px "Baloo 2", sans-serif';
      ctx.fillText('Z', -u * 0.35, u * 0.35);
      break;
    case 'splat':
      ctx.fillStyle = found ? '#ffb14e' : '#b9b2c9';
      ctx.beginPath();
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * TAU - Math.PI / 2;
        const rr = (i % 2 === 0) ? u : u * 0.55;
        ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath(); ctx.fill();
      break;
    default:
      ctx.beginPath(); ctx.arc(0, 0, u * 0.5, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

/* ---------- screens ---------- */
function drawTitle(ctx, game) {
  const t = game.time;
  // backdrop
  const g = ctx.createLinearGradient(0, 0, 0, STAGE_H);
  g.addColorStop(0, '#ffe3ef'); g.addColorStop(1, '#ffd0e3');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, STAGE_W, STAGE_H);
  // drifting deco blobs
  for (let i = 0; i < 6; i++) {
    const bx = 120 + i * 118 + Math.sin(t * 0.7 + i * 2) * 24;
    const by = 240 + ((i * 173) % 700) + Math.cos(t * 0.5 + i) * 18;
    const br = 44 + (i % 3) * 14;
    const col = ['#ff8fb3', '#7fe3b2', '#ffd94e', '#4ec9ff', '#c3b2f2', '#ffb14e'][i];
    ctx.globalAlpha = 0.5;
    const bg = ctx.createLinearGradient(0, by - br, 0, by + br);
    bg.addColorStop(0, Util.shade(col, 32)); bg.addColorStop(1, Util.shade(col, -8));
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(bx, by, br, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // mascot blobs flanking the logo
  drawMascot(ctx, 130, 470, 74, '#ff8fb3', t, 'bouncy');
  drawMascot(ctx, 670, 470, 74, '#7fe3b2', t + 2, 'sticky');
  // logo: each letter bounces on its own spring
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const word1 = 'WOBBLE', word2 = 'WORLD';
  const cols = ['#ff6f9f', '#ff9e57', '#ffd166', '#7fe3b2', '#4ec9ff', '#c39bff'];
  let x = STAGE_W / 2 - (word1.length - 1) * 44;
  ctx.font = 'bold 96px "Baloo 2", sans-serif';
  for (let i = 0; i < word1.length; i++) {
    const bounce = Math.abs(Math.sin(t * 2.2 + i * 0.55)) * -26;
    ctx.fillStyle = cols[i % cols.length];
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 10;
    ctx.strokeText(word1[i], x, 400 + bounce);
    ctx.fillText(word1[i], x, 400 + bounce);
    x += 88;
  }
  x = STAGE_W / 2 - (word2.length - 1) * 44;
  for (let i = 0; i < word2.length; i++) {
    const bounce = Math.abs(Math.sin(t * 2.2 + i * 0.55 + 2)) * -26;
    ctx.fillStyle = cols[(i + 3) % cols.length];
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 10;
    ctx.strokeText(word2[i], x, 500 + bounce);
    ctx.fillText(word2[i], x, 500 + bounce);
    x += 88;
  }
  ctx.fillStyle = '#7a6a8f';
  ctx.font = '24px "Baloo 2", sans-serif';
  ctx.fillText('A jelly toy box full of giggles', STAGE_W / 2, 590);
  // buttons
  for (const b of game.buttons) b.draw(ctx, game);
  // progress note
  ctx.fillStyle = '#a08fb8';
  ctx.font = '20px "Baloo 2", sans-serif';
  const n = game.save.found.length;
  if (n > 0) ctx.fillText('Giggle moments found: ' + n + ' / ' + GIGGLE_TOTAL, STAGE_W / 2, 1090);
}

function drawMascot(ctx, x, y, r, color, t, kind) {
  const hop = Math.abs(Math.sin(t * 2.4)) * -22;
  const sq = 1 + Math.sin(t * 4.8) * 0.05;
  ctx.save();
  ctx.translate(x, y + hop);
  ctx.scale(1 / sq, sq);
  const g = ctx.createLinearGradient(0, -r, 0, r);
  g.addColorStop(0, Util.shade(color, 36)); g.addColorStop(1, Util.shade(color, -12));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.ellipse(-r * 0.34, -r * 0.4, r * 0.3, r * 0.17, -0.5, 0, TAU); ctx.fill();
  // eyes
  ctx.fillStyle = '#ffffff';
  for (const sx of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(sx * r * 0.32, -r * 0.1, r * 0.18, r * 0.2, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4a3b5c';
    ctx.beginPath(); ctx.arc(sx * r * 0.32, -r * 0.08, r * 0.08, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
  }
  // smile
  ctx.strokeStyle = '#4a3b5c'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, r * 0.22, r * 0.3, 0.25 * Math.PI, 0.75 * Math.PI); ctx.stroke();
  ctx.restore();
}

function drawHowto(ctx, game) {
